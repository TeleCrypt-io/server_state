# CI-only runtime fixtures. Tests bind each copied security/secret field to the canonical rendered
# service contract; unrelated production mounts, networks, health checks, and dependencies stay out
# of these one-purpose proofs.
services:
  synapse-secret-proof:
    image: ${SYNAPSE_IMAGE:?set SYNAPSE_IMAGE}
    user: "991:991"
    read_only: true
    security_opt: ["no-new-privileges=true"]
    cap_drop: ["ALL"]
    network_mode: none
    secrets:
      - source: synapse_secrets_json
        target: /secrets.json
      - source: synapse_signing_key
        target: /signing.key

  synapse-loader-proof:
    image: ${SYNAPSE_IMAGE:?set SYNAPSE_IMAGE}
    user: "991:991"
    read_only: true
    security_opt: ["no-new-privileges=true"]
    cap_drop: ["ALL"]
    network_mode: none
    tmpfs:
      - /tmp:uid=991,gid=991,mode=1777,size=16m
      - /staging:uid=991,gid=991,mode=0700,size=16m
    volumes:
      - ../synapse.yaml:/homeserver.yaml:ro
      - ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/runtime/synapse.identity.yaml:/runtime-identity.yaml:ro
      - ../synapse.log.config:/log.config:ro
    environment:
      - TMPDIR=/staging/tmp
    secrets:
      - source: synapse_secrets_json
        target: /secrets.json
      - source: synapse_signing_key
        target: /signing.key

  mas-secret-proof:
    image: ${MAS_IMAGE:?set MAS_IMAGE}
    user: "991:991"
    read_only: true
    security_opt: ["no-new-privileges=true"]
    cap_drop: ["ALL"]
    network_mode: none
    volumes:
      - ../mas.yaml:/config.yaml:ro
      - ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/runtime/mas.identity.yaml:/runtime-identity.yaml:ro
    secrets:
      - source: mas_secrets_json
        target: /secrets.json

secrets:
  synapse_secrets_json:
    file: ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/secrets/synapse.secrets.json
  synapse_signing_key:
    file: ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/secrets/synapse_signing.key
  mas_secrets_json:
    file: ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/secrets/mas.secrets.json
