# CI-only runtime fixtures. Tests bind each copied security/secret field to the canonical rendered
# service contract; unrelated production mounts, networks, health checks, and dependencies stay out
# of these one-purpose proofs.
services:
  synapse-secret-proof:
    image: ${SYNAPSE_IMAGE:?set SYNAPSE_IMAGE}
    user: "991:991"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    network_mode: none
    secrets:
      - source: synapse_secrets_json
        target: /secrets.json
        uid: "991"
        gid: "991"
        mode: 0400
      - source: synapse_signing_key
        target: /signing.key
        uid: "991"
        gid: "991"
        mode: 0400

  synapse-loader-proof:
    image: ${SYNAPSE_IMAGE:?set SYNAPSE_IMAGE}
    user: "991:991"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    network_mode: none
    volumes:
      - ../synapse.yaml:/homeserver.yaml:ro
      - ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/runtime/synapse.identity.yaml:/runtime-identity.yaml:ro
      - ../synapse.log.config:/log.config:ro
    secrets:
      - source: synapse_secrets_json
        target: /secrets.json
        uid: "991"
        gid: "991"
        mode: 0400
      - source: synapse_signing_key
        target: /signing.key
        uid: "991"
        gid: "991"
        mode: 0400

  mas-secret-proof:
    image: ${MAS_IMAGE:?set MAS_IMAGE}
    user: "991:991"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    network_mode: none
    volumes:
      - ../mas.yaml:/config.yaml:ro
      - ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/runtime/mas.identity.yaml:/runtime-identity.yaml:ro
    secrets:
      - source: mas_secrets_json
        target: /secrets.json
        uid: "991"
        gid: "991"
        mode: 0400

secrets:
  synapse_secrets_json:
    environment: SYNAPSE_SECRETS_JSON
  synapse_signing_key:
    environment: SYNAPSE_SIGNING_KEY
  mas_secrets_json:
    environment: MAS_SECRETS_JSON
