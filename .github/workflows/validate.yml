name: validate

on:
  push:
    branches: [main]
    tags: ["server-state-*"]
  pull_request:

concurrency:
  group: server-state-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TELECRYPT_DATA_DIR: /tmp/telecrypt-data
      BILLING_ENVIRONMENT: test
      GIT_CONFIG_SYSTEM: /dev/null
      GIT_CONFIG_GLOBAL: /tmp/telecrypt-gitconfig
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: ""
    steps:
      - uses: actions/checkout@v7.0.1
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
          GIT_CONFIG_KEY_1: advice.detachedHead
          GIT_CONFIG_VALUE_1: "false"
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load canonical image manifest
        run: |
          set -euo pipefail
          python3 .github/scripts/validate.py source

      - name: Test published-image provenance contract
        run: |
          set -euo pipefail
          python3 .github/scripts/test_validate.py

      - name: Require deterministic-egress toolchain
        run: |
          set -euo pipefail
          bounded_value() {
            local output="$1"
            shift
            .github/scripts/run_bounded_combined.sh "$output" "$@"
            tr -d '\r\n' <"$output"
          }
          engine_version="$(bounded_value "$RUNNER_TEMP/engine-version" docker version --format '{{.Server.Version}}')"
          compose_version="$(bounded_value "$RUNNER_TEMP/compose-version" docker compose version --short)"
          python3 .github/scripts/validate.py toolchain "$engine_version" "$compose_version"

      - name: Authenticate package registry for exact manifest checks
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require every exact image manifest before Compose pulls
        run: |
          set -euo pipefail
          images_file="$RUNNER_TEMP/server-state-images"
          failures_file="$RUNNER_TEMP/server-state-image-failures"
          awk -F= 'NF == 2 { print $2 }' versions.env >"$images_file"
          test "$(wc -l <"$images_file")" -eq 5
          : >"$failures_file"
          while IFS= read -r image; do
            [ -n "$image" ] || continue
            inspection_file="$RUNNER_TEMP/server-state-image-inspection"
            if ! .github/scripts/run_bounded_combined.sh --max-bytes 65536 "$inspection_file" \
              docker manifest inspect "$image"; then
              printf '%s\n' "$image" >>"$failures_file"
              printf 'image manifest unavailable: %s\n' "$image" >&2
            fi
          done <"$images_file"
          if [ -s "$failures_file" ]; then
            echo 'one or more exact image manifests are unavailable; no Compose pull was attempted' >&2
            cat "$failures_file" >&2
            exit 1
          fi

      - name: Require annotated exact release tag on refreshed main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^server-state-[0-9a-f]{7,10}$ ]]
          git_value() { bash .github/scripts/git_transport.sh local-read "$1" "$2"; }
          test "$(git_value cat-file-type "refs/tags/$GITHUB_REF_NAME")" = tag
          release_commit="$(git_value rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
          release_suffix="${GITHUB_REF_NAME#server-state-}"
          [[ "$release_commit" == "$release_suffix"* ]]
          test "$release_commit" = "$GITHUB_SHA"
          bash .github/scripts/git_transport.sh fetch "$GITHUB_REPOSITORY" \
            refs/heads/main:refs/remotes/origin/main
          test "$(git_value rev-parse HEAD)" = "$release_commit"
          test "$release_commit" = "$GITHUB_SHA"
          test "$release_commit" = "$(git_value rev-parse refs/remotes/origin/main)"

      - name: Validate Compose
        env:
          SYNAPSE_SECRETS_JSON: >-
            {"database":{"args":{"user":"telecrypt_synapse_stage_user","password":"ci-synapse-db-secret","database":"telecrypt_synapse_stage","host":"db.invalid","port":5432,"sslmode":"verify-full","connect_timeout":5}},"matrix_authentication_service":{"secret":"ci-matrix-secret"},"media_storage_providers":[{"module":"s3_storage_provider.S3StorageProviderBackend","store_local":true,"store_remote":false,"store_synchronous":true,"config":{"bucket":"ci-bucket","region_name":"us-east-1","endpoint_url":"https://s3.telecrypt.io","access_key_id":"ci-access","secret_access_key":"ci-secret"}}],"macaroon_secret_key":"ci-macaroon-secret","form_secret":"ci-form-secret"}
          SYNAPSE_SIGNING_KEY: ci-synapse-signing-fixture
          MAS_SECRETS_JSON: >-
            {"secrets":{"encryption":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef","keys":[{"key":"ci-signing-key"}]},"database":{"uri":"postgresql://telecrypt_mas_stage_user:ci-mas-db-secret@db.invalid/telecrypt_mas_stage?connect_timeout=5&sslmode=verify-full"},"matrix":{"homeserver":"stage.telecrypt.io","secret":"ci-matrix-secret"},"clients":[{"client_id":"01ARZ3NDEKTSV4RRFFQ69G5FAV","client_auth_method":"client_secret_basic","client_secret":"ci-plan-client-secret","redirect_uris":["https://backend.stage.telecrypt.io/plan/callback"]},{"client_id":"01ARZ3NDEKTSV4RRFFQ69G5FAW","client_auth_method":"client_secret_basic","client_secret":"ci-janitor-client-secret","redirect_uris":[]}]}
        run: |
          set -euo pipefail
          # Nonsecret CI placeholders satisfy Compose's required interpolation. Harness supplies
          # the snapshotted private values on the authorized deployment path.
          private_keys=(
            MAS_ADMIN_CLIENT_ID MAS_ADMIN_CLIENT_SECRET JANITOR_DB_URL OWNER_EMAIL JANITOR_DRY_RUN
            SMTP_HOST SMTP_USERNAME SMTP_PASSWORD SMTP_FROM
            MAS_OIDC_CLIENT_ID MAS_OIDC_CLIENT_SECRET PLAN_SESSION_KEY PLAN_ASSERTION_PRIVATE_KEY
            SYNAPSE_ADMIN_TOKEN CASHIER_DB_URL DODO_API_KEY DODO_WEBHOOK_SECRET DODO_PRODUCT_ID
            PLAN_ASSERTION_PUBLIC_KEY
          )
          for key in "${private_keys[@]}"; do
            printf '%s=ci-compose-fixture\n' "$key" >> "$GITHUB_ENV"
            export "$key=ci-compose-fixture"
          done
          mkdir -p "$TELECRYPT_DATA_DIR"
          rendered_compose="$RUNNER_TEMP/server-state-compose.json"
          .github/scripts/run_bounded_combined.sh --max-bytes 1048576 "$rendered_compose" \
            docker compose --profile janitor --env-file .env.example config --format json
          test "$(wc -c <"$rendered_compose")" -le 1048576
          printf 'COMPOSE_RENDERED_JSON=%s\n' "$rendered_compose" >> "$GITHUB_ENV"

      - name: Verify rendered Compose closed contracts
        run: |
          python3 .github/scripts/validate.py rendered-compose "$COMPOSE_RENDERED_JSON"

      - name: Verify UID-991 secret runtime contract
        env:
          SYNAPSE_SECRETS_JSON: >-
            {"database":{"args":{"user":"telecrypt_synapse_stage_user","password":"ci-synapse-db-secret","database":"telecrypt_synapse_stage","host":"db.invalid","port":5432,"sslmode":"verify-full","connect_timeout":5}},"matrix_authentication_service":{"secret":"ci-matrix-secret"},"media_storage_providers":[{"module":"s3_storage_provider.S3StorageProviderBackend","store_local":true,"store_remote":false,"store_synchronous":true,"config":{"bucket":"ci-bucket","region_name":"us-east-1","endpoint_url":"https://s3.telecrypt.io","access_key_id":"ci-access","secret_access_key":"ci-secret"}}],"macaroon_secret_key":"ci-macaroon-secret","form_secret":"ci-form-secret"}
          SYNAPSE_SIGNING_KEY: ci-synapse-signing-fixture
          MAS_SECRETS_JSON: >-
            {"secrets":{"encryption":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef","keys":[{"key":"ci-signing-key"}]},"database":{"uri":"postgresql://telecrypt_mas_stage_user:ci-mas-db-secret@db.invalid/telecrypt_mas_stage?connect_timeout=5&sslmode=verify-full"},"matrix":{"homeserver":"stage.telecrypt.io","secret":"ci-matrix-secret"},"clients":[{"client_id":"01ARZ3NDEKTSV4RRFFQ69G5FAV","client_auth_method":"client_secret_basic","client_secret":"ci-plan-client-secret","redirect_uris":["https://backend.stage.telecrypt.io/plan/callback"]},{"client_id":"01ARZ3NDEKTSV4RRFFQ69G5FAW","client_auth_method":"client_secret_basic","client_secret":"ci-janitor-client-secret","redirect_uris":[]}]}
        run: |
          set -euo pipefail
          mkdir -p "$TELECRYPT_DATA_DIR/runtime"
          install -m 644 /dev/null "$TELECRYPT_DATA_DIR/runtime/synapse.identity.yaml"
          install -m 644 /dev/null "$TELECRYPT_DATA_DIR/runtime/mas.identity.yaml"
          synapse_output="$RUNNER_TEMP/synapse-secret-proof.log"
          if ! .github/scripts/run_bounded_combined.sh "$synapse_output" docker compose --ansi never --env-file .env.example run --rm --no-deps \
            --entrypoint python synapse -c '
          import os
          import json
          import stat
          from pathlib import Path

          expected_json_keys = {"database", "matrix_authentication_service", "media_storage_providers", "macaroon_secret_key", "form_secret"}
          expected = {"/signing.key": "ci-synapse-signing-fixture"}
          assert os.getuid() == 991, os.getuid()
          for path, value in expected.items():
              mounted = Path(path)
              assert mounted.read_text(encoding="utf-8") == value, path
              metadata = mounted.stat()
              assert metadata.st_uid == 991, (path, metadata.st_uid)
              assert stat.S_IMODE(metadata.st_mode) == 0o400, (path, oct(metadata.st_mode))
          synapse_json = json.loads(Path("/secrets.json").read_text(encoding="utf-8"))
          assert set(synapse_json) == expected_json_keys
          for forbidden in ("/mas-secrets.json", "/run/secrets/mas_secrets_json"):
              assert not Path(forbidden).exists(), forbidden
          environment = os.environ
          for variable in ("SYNAPSE_SECRETS_JSON", "SYNAPSE_SIGNING_KEY", "MAS_SECRETS_JSON"):
              assert variable not in environment, variable
          for value in set(expected.values()) | {"ci-mas-secret-fixture"}:
              assert value not in environment.values(), value
          print("uid-991 secret mount readable with only Synapse grants")
          '; then
            echo "Synapse secret proof failed; bounded redacted command output follows:" >&2
            sed -E 's/ci-[[:alnum:]_.-]+/[fixture]/g' "$synapse_output" | tail -n 40 >&2
            exit 1
          fi
          output="$(<"$synapse_output")"
          test "$(tail -n 1 <<<"$output")" = "uid-991 secret mount readable with only Synapse grants"
          for marker in \
            ci-synapse-secret-fixture \
            ci-synapse-signing-fixture \
            ci-mas-secret-fixture \
            synapse_secrets_json \
            synapse_signing_key \
            mas_secrets_json; do
            if grep -F -- "$marker" <<<"$output" >/dev/null; then
              echo "secret fixture or source name leaked into Compose output" >&2
              exit 1
            fi
          done
          printf '%s\n' "$output"

      # The pinned MAS image is distroless; use its bundled mas-cli directly rather than assuming
      # a shell or Python diagnostic exists. Capture config output so fixture values never reach CI logs.
      - name: Verify UID-991 MAS secret isolation
        env:
          SYNAPSE_SECRETS_JSON: >-
            {"database":{"args":{"user":"telecrypt_synapse_stage_user","password":"ci-synapse-db-secret","database":"telecrypt_synapse_stage","host":"db.invalid","port":5432,"sslmode":"verify-full","connect_timeout":5}},"matrix_authentication_service":{"secret":"ci-matrix-secret"},"media_storage_providers":[{"module":"s3_storage_provider.S3StorageProviderBackend","store_local":true,"store_remote":false,"store_synchronous":true,"config":{"bucket":"ci-bucket","region_name":"us-east-1","endpoint_url":"https://s3.telecrypt.io","access_key_id":"ci-access","secret_access_key":"ci-secret"}}],"macaroon_secret_key":"ci-macaroon-secret","form_secret":"ci-form-secret"}
          SYNAPSE_SIGNING_KEY: ci-synapse-signing-fixture
          MAS_SECRETS_JSON: '{"secrets":{"encryption":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef","keys":[{"key":"ci-signing-key"}]},"database":{"uri":"postgresql://telecrypt_mas_stage_user:ci-mas-db-secret@db.invalid/telecrypt_mas_stage?connect_timeout=5&sslmode=verify-full"},"matrix":{"homeserver":"stage.telecrypt.io","secret":"ci-matrix-secret"},"clients":[{"client_id":"01ARZ3NDEKTSV4RRFFQ69G5FAV","client_auth_method":"client_secret_basic","client_secret":"ci-plan-client-secret","redirect_uris":["https://backend.stage.telecrypt.io/plan/callback"]},{"client_id":"01ARZ3NDEKTSV4RRFFQ69G5FAW","client_auth_method":"client_secret_basic","client_secret":"ci-janitor-client-secret","redirect_uris":[]}]}'
        run: |
          set -euo pipefail
          mkdir -p "$TELECRYPT_DATA_DIR/runtime"
          cat > "$TELECRYPT_DATA_DIR/runtime/mas.identity.yaml" <<'EOF'
          http:
            public_base: https://backend.stage.telecrypt.io/auth/
            issuer: https://backend.stage.telecrypt.io/auth/
          experimental:
            plan_management_iframe_uri: https://backend.stage.telecrypt.io/plan
          policy:
            data:
              admin_clients:
                - 01ARZ3NDEKTSV4RRFFQ69G5FAW
          EOF

          mas_container=ci-mas-secret-proof
          missing_container=ci-mas-synapse-secret-proof
          cleanup() {
            # shellcheck disable=SC2317
            docker rm -f "$mas_container" "$missing_container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          bounded_docker_value() {
            local output="$1"
            shift
            .github/scripts/run_bounded_combined.sh "$output" docker "$@"
            tr -d '\r\n' <"$output"
          }
          mas_output="$RUNNER_TEMP/mas-secret-proof.log"
          .github/scripts/run_bounded_combined.sh "$mas_output" docker compose --ansi never --env-file .env.example run \
            --name "$mas_container" --no-deps --entrypoint /usr/local/bin/mas-cli mas \
            config check --config=/config.yaml --config=/secrets.json --config=/runtime-identity.yaml
          mas_check="$(<"$mas_output")"
          test "$(bounded_docker_value "$RUNNER_TEMP/mas-user" inspect --format '{{.Config.User}}' "$mas_container")" = "991:991"
          for marker in \
            ci-synapse-secret-fixture \
            ci-synapse-signing-fixture; do
            if grep -F -- "$marker" <<<"$mas_check" >/dev/null; then
              echo "unexpected secret fixture in sanitized MAS proof output" >&2
              exit 1
            fi
          done
          docker rm -f "$mas_container" >/dev/null

          missing_output_file="$RUNNER_TEMP/mas-missing-secret-proof.log"
          if .github/scripts/run_bounded_combined.sh "$missing_output_file" docker compose --ansi never --env-file .env.example run \
            --name "$missing_container" --no-deps --entrypoint /usr/local/bin/mas-cli mas \
            config check --config=/config.yaml --config=/secrets.json --config=/runtime-identity.yaml \
            --config=/signing.key; then
            echo "MAS unexpectedly opened Synapse's signing-key path" >&2
            exit 1
          fi
          missing_output="$(<"$missing_output_file")"
          grep -F -- "/signing.key" <<<"$missing_output" >/dev/null
          for marker in ci-synapse-secret-fixture ci-synapse-signing-fixture; do
            if grep -F -- "$marker" <<<"$missing_output" >/dev/null; then
              echo "Synapse fixture leaked into MAS isolation proof output" >&2
              exit 1
            fi
          done
          echo "MAS uid 991 read its own 0400 secret and could not open Synapse signing.key"

      - name: Verify pinned Synapse JSON config loader
        env:
          SYNAPSE_SECRETS_JSON: >-
            {"database":{"args":{"user":"telecrypt_synapse_stage_user","password":"ci-synapse-db-secret","database":"telecrypt_synapse_stage","host":"db.invalid","port":5432,"sslmode":"verify-full","connect_timeout":5}},"matrix_authentication_service":{"secret":"ci-matrix-secret"},"media_storage_providers":[{"module":"s3_storage_provider.S3StorageProviderBackend","store_local":true,"store_remote":false,"store_synchronous":true,"config":{"bucket":"ci-bucket","region_name":"us-east-1","endpoint_url":"https://s3.telecrypt.io","access_key_id":"ci-access","secret_access_key":"ci-secret"}}],"macaroon_secret_key":"ci-macaroon-secret","form_secret":"ci-form-secret"}
          SYNAPSE_SIGNING_KEY: ci-synapse-signing-fixture
          MAS_SECRETS_JSON: >-
            {"secrets":{"encryption":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef","keys":[{"key":"ci-signing-key"}]},"database":{"uri":"postgresql://telecrypt_mas_stage_user:ci-mas-db-secret@db.invalid/telecrypt_mas_stage?connect_timeout=5&sslmode=verify-full"},"matrix":{"homeserver":"stage.telecrypt.io","secret":"ci-matrix-secret"},"clients":[{"client_id":"01ARZ3NDEKTSV4RRFFQ69G5FAV","client_auth_method":"client_secret_basic","client_secret":"ci-plan-client-secret","redirect_uris":["https://backend.stage.telecrypt.io/plan/callback"]},{"client_id":"01ARZ3NDEKTSV4RRFFQ69G5FAW","client_auth_method":"client_secret_basic","client_secret":"ci-janitor-client-secret","redirect_uris":[]}]}
        run: |
          set -euo pipefail
          mkdir -p "$TELECRYPT_DATA_DIR/runtime"
          printf '%s\n' 'server_name: stage.telecrypt.io' 'public_baseurl: https://backend.stage.telecrypt.io/' > "$TELECRYPT_DATA_DIR/runtime/synapse.identity.yaml"
          printf '%s\n' 'http:' '  public_base: https://backend.stage.telecrypt.io/auth/' '  issuer: https://backend.stage.telecrypt.io/auth/' > "$TELECRYPT_DATA_DIR/runtime/mas.identity.yaml"
          synapse_loader_output="$RUNNER_TEMP/synapse-json-loader.log"
          .github/scripts/run_bounded_combined.sh "$synapse_loader_output" docker compose --ansi never --env-file .env.example run --rm --no-deps \
            --entrypoint python synapse -c '
          import inspect
          from synapse.config.homeserver import HomeServerConfig

          loader = HomeServerConfig()
          parameters = inspect.signature(loader.read_config).parameters
          values = {
              "config_dir_path": "/",
              "data_dir_path": "/data",
              "config_path": ["/homeserver.yaml", "/secrets.json", "/runtime-identity.yaml"],
              "generate_keys": False,
              "generate_secrets": False,
              "report_stats": False,
              "print_warnings": False,
          }
          loader.read_config(**{key: value for key, value in values.items() if key in parameters})
          print("Synapse JSON config loader accepted")
          '
          test "$(tail -n 1 "$synapse_loader_output")" = "Synapse JSON config loader accepted"

      - name: Verify exact selected container images
        env:
          SYNAPSE_SECRETS_JSON: >-
            {"database":{"args":{"user":"telecrypt_synapse_stage_user","password":"ci-synapse-db-secret","database":"telecrypt_synapse_stage","host":"db.invalid","port":5432,"sslmode":"verify-full","connect_timeout":5}},"matrix_authentication_service":{"secret":"ci-matrix-secret"},"media_storage_providers":[{"module":"s3_storage_provider.S3StorageProviderBackend","store_local":true,"store_remote":false,"store_synchronous":true,"config":{"bucket":"ci-bucket","region_name":"us-east-1","endpoint_url":"https://s3.telecrypt.io","access_key_id":"ci-access","secret_access_key":"ci-secret"}}],"macaroon_secret_key":"ci-macaroon-secret","form_secret":"ci-form-secret"}
          SYNAPSE_SIGNING_KEY: ci-synapse-signing-fixture
          MAS_SECRETS_JSON: >-
            {"secrets":{"encryption":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef","keys":[{"key":"ci-signing-key"}]},"database":{"uri":"postgresql://telecrypt_mas_stage_user:ci-mas-db-secret@db.invalid/telecrypt_mas_stage?connect_timeout=5&sslmode=verify-full"},"matrix":{"homeserver":"stage.telecrypt.io","secret":"ci-matrix-secret"},"clients":[{"client_id":"01ARZ3NDEKTSV4RRFFQ69G5FAV","client_auth_method":"client_secret_basic","client_secret":"ci-plan-client-secret","redirect_uris":["https://backend.stage.telecrypt.io/plan/callback"]},{"client_id":"01ARZ3NDEKTSV4RRFFQ69G5FAW","client_auth_method":"client_secret_basic","client_secret":"ci-janitor-client-secret","redirect_uris":[]}]}
        run: |
          set -euo pipefail
          images_file="$(mktemp)"
          raw_images_file="$(mktemp)"
          trap 'rm -f "$images_file" "$raw_images_file"' EXIT
          .github/scripts/run_bounded_combined.sh "$raw_images_file" \
            docker compose --profile janitor --env-file .env.example config --images
          test "$(wc -c <"$raw_images_file")" -le 65536
          sort -u "$raw_images_file" > "$images_file"
          python3 .github/scripts/validate.py image-list "$images_file"

      - name: Validate Caddy
        env:
          SYNAPSE_SECRETS_JSON: >-
            {"database":{"args":{"user":"telecrypt_synapse_stage_user","password":"ci-synapse-db-secret","database":"telecrypt_synapse_stage","host":"db.invalid","port":5432,"sslmode":"verify-full","connect_timeout":5}},"matrix_authentication_service":{"secret":"ci-matrix-secret"},"media_storage_providers":[{"module":"s3_storage_provider.S3StorageProviderBackend","store_local":true,"store_remote":false,"store_synchronous":true,"config":{"bucket":"ci-bucket","region_name":"us-east-1","endpoint_url":"https://s3.telecrypt.io","access_key_id":"ci-access","secret_access_key":"ci-secret"}}],"macaroon_secret_key":"ci-macaroon-secret","form_secret":"ci-form-secret"}
          SYNAPSE_SIGNING_KEY: ci-synapse-signing-fixture
          MAS_SECRETS_JSON: >-
            {"secrets":{"encryption":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef","keys":[{"key":"ci-signing-key"}]},"database":{"uri":"postgresql://telecrypt_mas_stage_user:ci-mas-db-secret@db.invalid/telecrypt_mas_stage?connect_timeout=5&sslmode=verify-full"},"matrix":{"homeserver":"stage.telecrypt.io","secret":"ci-matrix-secret"},"clients":[{"client_id":"01ARZ3NDEKTSV4RRFFQ69G5FAV","client_auth_method":"client_secret_basic","client_secret":"ci-plan-client-secret","redirect_uris":["https://backend.stage.telecrypt.io/plan/callback"]},{"client_id":"01ARZ3NDEKTSV4RRFFQ69G5FAW","client_auth_method":"client_secret_basic","client_secret":"ci-janitor-client-secret","redirect_uris":[]}]}
        run: |
          set -euo pipefail
          image_list="$RUNNER_TEMP/caddy-image-list"
          .github/scripts/run_bounded_combined.sh "$image_list" \
            docker compose --profile janitor --env-file .env.example config --images
          test "$(wc -c <"$image_list")" -le 65536
          caddy_image="$(awk '/docker.io\/caddy:/ { print; exit }' "$image_list")"
          test -n "$caddy_image"
          caddy_output="$RUNNER_TEMP/caddy-validate.log"
          .github/scripts/run_bounded_combined.sh "$caddy_output" docker run --rm \
            --user 65532:65532 \
            --read-only \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --network none \
            --tmpfs /config/caddy:uid=65532,gid=65532,mode=0700 \
            --tmpfs /data/caddy:uid=65532,gid=65532,mode=0700 \
            --env TRUSTED_PROXY=192.0.2.10/32 \
            --env SERVER_NAME=example.invalid \
            --volume "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$caddy_image" caddy validate --config /etc/caddy/Caddyfile
          test "$(wc -c <"$caddy_output")" -le 65536
          cat -- "$caddy_output"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/server-state-')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    env:
      GIT_CONFIG_SYSTEM: /dev/null
      GIT_CONFIG_GLOBAL: /tmp/telecrypt-gitconfig
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: ""
    steps:
      - uses: actions/checkout@v7.0.1
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
          GIT_CONFIG_KEY_1: advice.detachedHead
          GIT_CONFIG_VALUE_1: "false"
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create exact GitHub Release record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          authfile="$(mktemp)"
          metadata_dir="$(mktemp -d)"
          manifest_name="server-state-${GITHUB_REF_NAME#server-state-}-images.json"
          manifest_path="$RUNNER_TEMP/$manifest_name"
          cleanup() { rm -f "$authfile"; rm -rf "$metadata_dir" "$manifest_path"; }
          trap cleanup EXIT

          bounded_output() {
            local max_bytes="$1" output="$2" timeout_seconds="$3"
            shift 3
            (( max_bytes > 0 && max_bytes % 1024 == 0 )) || {
              echo "bounded output size must be a positive multiple of 1024 bytes" >&2
              return 1
            }
            local stderr="$output.stderr" status
            set +e
            .github/scripts/run_bounded_combined.sh --separate "$max_bytes" "$max_bytes" \
              "$output" "$stderr" "$timeout_seconds" "$@"
            status=$?
            set -e
            if [[ "$status" -ne 0 ]]; then
              echo "bounded command failed (status $status; stderr bytes $(wc -c < "$stderr"))" >&2
              return "$status"
            fi
            if [[ -s "$stderr" ]]; then
              echo "bounded command emitted unexpected stderr ($(wc -c < "$stderr") bytes)" >&2
              return 1
            fi
            test "$(wc -c < "$output")" -le "$max_bytes"
          }

          bounded_gh() {
            local max_stdout="$1" max_stderr="$2" max_file="$3" output="$4" stderr="$5" timeout_seconds="$6" status
            shift 6
            set +e
            .github/scripts/run_bounded_combined.sh --separate "$max_stdout" "$max_stderr" \
              "$output" "$stderr" "$timeout_seconds" "$@"
            status=$?
            set -e
            test "$(wc -c <"$output")" -le "$max_stdout"
            test "$(wc -c <"$stderr")" -le "$max_stderr"
            test "$(wc -c <"$output")" -le "$max_file"
            if [[ "$status" -eq 0 && -s "$stderr" ]]; then
              cat -- "$stderr" >&2
              return 1
            fi
            return "$status"
          }

          http_status() {
            local count
            count="$(grep -Ec '^HTTP/[0-9.]+[[:space:]][0-9]{3}([[:space:]]|$)' "$1")"
            test "$count" -eq 1
            sed -n '1s/^HTTP\/[0-9.]*[[:space:]]\([0-9][0-9][0-9]\).*$/\1/p' "$1"
          }

          http_body() {
            awk 'BEGIN { body = 0 } { line = $0; sub(/\r$/, "", line); if (!body) { if (line == "") body = 1; next } print }' "$1"
          }

          [[ "$GITHUB_REF_NAME" =~ ^server-state-[0-9a-f]{7,10}$ ]]
          release_commit="$GITHUB_SHA"
          release_suffix="${GITHUB_REF_NAME#server-state-}"
          [[ "$release_commit" == "$release_suffix"* ]]
          git_value() { bash .github/scripts/git_transport.sh local-read "$1" "$2"; }
          test "$(git_value rev-parse HEAD)" = "$release_commit"
          test "$(git_value cat-file-type "refs/tags/$GITHUB_REF_NAME")" = tag
          checkout_annotated_tag_sha="$(git_value rev-parse "refs/tags/$GITHUB_REF_NAME")"
          python3 .github/scripts/validate.py source

          verify_source_identity() {
            local current_annotated_tag_sha current_tag_commit remote_annotated_tag_sha remote_tag_path
            bounded_output 65536 "$metadata_dir/source-fetch.log" 30 bash .github/scripts/git_transport.sh fetch "$GITHUB_REPOSITORY" \
              refs/heads/main:refs/remotes/origin/main \
              "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            test "$(git_value cat-file-type "refs/tags/$GITHUB_REF_NAME")" = tag
            current_annotated_tag_sha="$(git_value rev-parse "refs/tags/$GITHUB_REF_NAME")"
            test "$current_annotated_tag_sha" = "$checkout_annotated_tag_sha"
            current_tag_commit="$(git_value rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
            test "$current_tag_commit" = "$release_commit"
            test "$(git_value rev-parse HEAD)" = "$release_commit"
            bounded_output 65536 "$metadata_dir/main-check" 30 bash .github/scripts/git_transport.sh \
              local-read rev-parse refs/remotes/origin/main
            test "$(git_value rev-parse refs/remotes/origin/main)" = "$release_commit"
            remote_tag_path="$metadata_dir/remote-tag.log"
            bounded_output 65536 "$remote_tag_path" 30 bash .github/scripts/git_transport.sh ls-remote "$GITHUB_REPOSITORY" \
              "refs/tags/$GITHUB_REF_NAME"
            test "$(wc -l < "$remote_tag_path")" = 1
            remote_annotated_tag_sha="$(awk 'NF == 2 { print $1 }' "$remote_tag_path")"
            [[ "$remote_annotated_tag_sha" =~ ^[0-9a-f]{40}$ ]]
            test "$remote_annotated_tag_sha" = "$checkout_annotated_tag_sha"
          }

          verify_source_identity
          export SERVER_STATE_ANNOTATED_TAG_SHA="$checkout_annotated_tag_sha"
          # shellcheck disable=SC1091
          source versions.env
          METADATA_DIR="$metadata_dir" timeout --signal=TERM --kill-after=5s 240s .github/scripts/fetch_product_releases.sh
          login_stderr="$metadata_dir/skopeo-login.stderr"
          login_stdout="$metadata_dir/skopeo-login.stdout"
          if ! printf '%s' "$GH_TOKEN" | .github/scripts/run_bounded_combined.sh --separate 65536 65536 \
            "$login_stdout" "$login_stderr" 30 skopeo login --authfile "$authfile" \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io; then
            rm -f "$login_stderr"
            exit 1
          fi
          if [[ -s "$login_stderr" ]]; then
            echo "skopeo login emitted unexpected stderr" >&2
            rm -f "$login_stderr"
            exit 1
          fi
          rm -f "$login_stderr"
          for key in CADDY_IMAGE SYNAPSE_IMAGE MAS_IMAGE CONTROLPLANE_IMAGE CASHIER_IMAGE; do
            image="${!key}"
            name="$(python3 .github/scripts/validate.py image-name "$image")"
            repository="${image%:*}"
            digest_path="$metadata_dir/$key.tag-digest"
            # Resolve each deployment tag once. Keep this top-level tag/index digest as the exact
            # deployment coordinate; inspect the linux/amd64 child selected through that immutable
            # digest for metadata, labels, and config while Compose keeps the human-readable tag.
            bounded_output 1024 "$digest_path" 60 skopeo inspect --authfile "$authfile" --no-tags --format '{{.Digest}}' \
              "docker://$image"
            resolved_digest="$(<"$digest_path")"
            [[ "$resolved_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            resolved_image="docker://$repository@$resolved_digest"
            bounded_output 1048576 "$metadata_dir/$name.metadata" 60 skopeo inspect --authfile "$authfile" --no-tags \
              --override-os linux --override-arch amd64 --format '{{json .}}' \
              "$resolved_image"
            bounded_output 1048576 "$metadata_dir/$name.labels" 60 skopeo inspect --authfile "$authfile" \
              --override-os linux --override-arch amd64 --format '{{json .Labels}}' \
              "$resolved_image"
            bounded_output 1048576 "$metadata_dir/$name.config" 60 skopeo inspect --authfile "$authfile" --config \
              --override-os linux --override-arch amd64 \
              "$resolved_image"
          done
          python3 .github/scripts/validate.py image-release-manifest \
            "$metadata_dir" "$GITHUB_REF_NAME" "$manifest_path"
          manifest_digest="sha256:$(sha256sum "$manifest_path" | awk '{print $1}')"
          manifest_size="$(wc -c < "$manifest_path")"
          test "$manifest_size" -gt 0 -a "$manifest_size" -le 1048576
          verify_registry_digests() {
            for key in CADDY_IMAGE SYNAPSE_IMAGE MAS_IMAGE CONTROLPLANE_IMAGE CASHIER_IMAGE; do
              image="${!key}"
              expected_digest="$(jq -er --arg key "$key" '.images[$key].digest' "$manifest_path")"
              digest_path="$metadata_dir/$key.digest"
              bounded_output 1024 "$digest_path" 60 skopeo inspect \
                --authfile "$authfile" --no-tags --format '{{.Digest}}' "docker://$image"
              current_digest="$(<"$digest_path")"
              test "$current_digest" = "$expected_digest"
            done
          }
          verify_registry_digests

          release_body="Exact server_state image digest manifest for commit $release_commit."
          check_server_release() {
            local release_path="$1" release_id="$2"
            test "$(wc -c < "$release_path")" -le 1048576
            jq -e --arg id "$release_id" --arg tag "$GITHUB_REF_NAME" \
              --arg name "$manifest_name" --arg digest "$manifest_digest" \
              --arg body "$release_body" \
              --argjson size "$manifest_size" '
                (.id | type) == "number" and (.id | tostring) == $id and (.id == (.id | floor)) and .id > 0 and
                (.body | type) == "string" and .body == $body and
                .tag_name == $tag and .name == $tag and .draft == false and .prerelease == false and .immutable == true and
                (.assets | length) == 1 and
                .assets[0].name == $name and (.assets[0] | has("label") and .label == null) and .assets[0].state == "uploaded" and
                (.assets[0].id | type) == "number" and (.assets[0].id == (.assets[0].id | floor)) and .assets[0].id > 0 and
                (.assets[0].size | type) == "number" and (.assets[0].size == (.assets[0].size | floor)) and .assets[0].size == $size and .assets[0].size > 0 and .assets[0].size <= 1048576 and
                (.assets[0].digest | type) == "string" and .assets[0].digest == $digest
              ' "$release_path" >/dev/null
          }
          check_server_draft() {
            local release_path="$1" release_id="$2"
            test "$(wc -c < "$release_path")" -le 1048576
            jq -e --arg id "$release_id" --arg tag "$GITHUB_REF_NAME" --arg name "$manifest_name" \
              --arg body "$release_body" '
                (.id | type) == "number" and (.id | tostring) == $id and (.id == (.id | floor)) and .id > 0 and
                (.body | type) == "string" and .body == $body and
                .tag_name == $tag and .name == $tag and .draft == true and .prerelease == false and
                (.assets | type == "array" and length <= 1) and
                ((.assets | length) == 0 or
                  ((.assets | length) == 1 and .assets[0].name == $name and
                   .assets[0].state == "uploaded" and
                   (.assets[0].id | type) == "number" and (.assets[0].id == (.assets[0].id | floor)) and .assets[0].id > 0 and
                   (.assets[0].size | type) == "number" and (.assets[0].size == (.assets[0].size | floor)) and .assets[0].size > 0 and .assets[0].size <= 1048576))
              ' "$release_path" >/dev/null
          }
          release_json_path="$RUNNER_TEMP/release.json"
          release_error_path="$RUNNER_TEMP/release.error"
          release_headers_path="$RUNNER_TEMP/release.headers"
          get_release_by_id() {
            local release_id="$1" command_status code
            [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
            set +e
            bounded_gh 1048576 65536 1048576 "$release_headers_path" "$release_error_path" 30 \
              gh api --include --hostname github.com \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/$release_id"
            command_status=$?
            set -e
            code="$(http_status "$release_headers_path")"
            case "$code" in
              200)
                test "$command_status" -eq 0
                test ! -s "$release_error_path"
                http_body "$release_headers_path" >"$release_json_path"
                test "$(wc -c <"$release_json_path")" -le 1048576
                return 0
                ;;
              404)
              test "$command_status" -ne 0
              return 4
              ;;
              *)
                cat -- "$release_error_path" >&2
                return 1
                ;;
            esac
          }
          discover_release() {
            local page=1 page_size list_status list_code page_headers page_json match_count
            local max_release_pages=100
            local matches_path="$metadata_dir/release-matches.jsonl"
            : >"$matches_path"
            while :; do
              page_headers="$metadata_dir/release-page-$page.headers"
              page_json="$metadata_dir/release-page-$page.json"
              set +e
              bounded_gh 1048576 65536 1048576 "$page_headers" "$page_headers.error" 30 \
                gh api --include --hostname github.com \
                --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2026-03-10' \
                --jq '[.[] | {id,tag_name,draft}]' \
                "repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page"
              list_status=$?
              set -e
              test "$list_status" -eq 0
              list_code="$(http_status "$page_headers")"
              test "$list_code" = 200
              http_body "$page_headers" >"$page_json"
              test "$(wc -c <"$page_json")" -le 1048576
              jq -e 'type == "array" and length <= 100' "$page_json" >/dev/null
              jq -c --arg tag "$GITHUB_REF_NAME" '.[] | select(.tag_name == $tag) | {id,tag_name,draft}' "$page_json" >>"$matches_path"
              page_size="$(jq -er 'length' "$page_json")"
              if [[ "$page_size" -lt 100 ]]; then
                break
              fi
              if [[ "$page" -ge "$max_release_pages" ]]; then
                echo "Release list completeness cannot be proven within the bounded page limit" >&2
                exit 1
              fi
              page=$((page + 1))
            done
            match_count="$(jq -s -er 'length' "$matches_path")"
            [[ "$match_count" -le 1 ]]
            if [[ "$match_count" -eq 0 ]]; then
              release_discovery_state="absent"
              release_id=""
              return 0
            fi
            release_id="$(jq -s -er '.[0].id | select(type == "number" and . == floor and . > 0) | tostring' "$matches_path")"
            release_discovery_state="$(jq -s -er 'if .[0].draft == true then "draft" elif .[0].draft == false then "published" else empty end' "$matches_path")"
          }
          download_and_compare_manifest() {
            local directory="$1" asset_id="$2"
            mkdir -p "$directory"
            bounded_gh 1048576 65536 1048576 "$directory/$manifest_name" "$directory/$manifest_name.error" 120 gh api \
              --hostname github.com \
              --header 'Accept: application/octet-stream' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            test "$(wc -c < "$directory/$manifest_name")" -le 1048576
            cmp -- "$manifest_path" "$directory/$manifest_name"
          }

          # Re-fetch the source identity after all registry work and immediately before the
          # release transaction. The tag and current remote main must still name this commit.
          verify_source_identity
          discover_release
          case "$release_discovery_state" in
            published)
              echo "An exact published Release already exists; refusing to mutate it" >&2
              exit 1
              ;;
            draft)
              get_release_by_id "$release_id"
              check_server_draft "$release_json_path" "$release_id"
              ;;
            absent)
              # Reconfirm the authoritative source immediately before the only create mutation.
              verify_source_identity
              create_path="$metadata_dir/release-create.json"
              set +e
              bounded_gh 65536 65536 65536 "$create_path" "$metadata_dir/release-create.error" 60 \
                gh api --hostname github.com --method POST \
                --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2026-03-10' \
                --raw-field "tag_name=$GITHUB_REF_NAME" \
                --raw-field "name=$GITHUB_REF_NAME" \
                --raw-field "body=$release_body" \
                --raw-field "target_commitish=$release_commit" \
                --field draft=true --field prerelease=false \
                "repos/$GITHUB_REPOSITORY/releases"
              create_status=$?
              set -e
              if [[ "$create_status" -eq 0 ]]; then
                release_id="$(jq -er '.id | select(type == "number" and . == floor and . > 0) | tostring' "$create_path")"
              else
                # A lost create response is recoverable only through a complete, unique draft
                # discovery. Any absent or ambiguous result fails closed.
                test ! -s "$metadata_dir/release-create.error"
                discover_release
                test "$release_discovery_state" = draft
              fi
              get_release_by_id "$release_id"
              check_server_draft "$release_json_path" "$release_id"
              ;;
            *)
              echo "Release discovery returned an unknown state" >&2
              exit 1
              ;;
          esac
          asset_count="$(jq -er '.assets|length' "$release_json_path")"
          if [[ "$asset_count" -eq 0 ]]; then
            test "$manifest_size" -le 1048576
            upload_url="$(jq -er '.upload_url | select(type == "string" and test("^https://uploads\\.github\\.com/repos/[^/]+/[^/]+/releases/[0-9]+/assets\\{\\?name,label\\}$"))' "$release_json_path")"
            upload_url="${upload_url%\{*}"
            test "$upload_url" = "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets"
            set +e
            bounded_gh 65536 65536 65536 "$metadata_dir/release-upload.log" "$metadata_dir/release-upload.error" 120 \
              gh api --hostname github.com --method POST \
              --header 'Accept: application/vnd.github+json' \
              --header 'Content-Type: application/json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --input "$manifest_path" "$upload_url?name=$manifest_name"
            upload_status=$?
            set -e
            test ! -s "$metadata_dir/release-upload.error"
            get_release_by_id "$release_id"
          fi
          get_release_by_id "$release_id"
          check_server_draft "$release_json_path" "$release_id"
          release_asset_id="$(jq -er --arg name "$manifest_name" \
            '.assets | select(length == 1) | .[0] | select(.name == $name and (.id | type == "number" and . == floor and . > 0)) | .id' "$release_json_path")"
          draft_dir="$RUNNER_TEMP/draft-release"
          download_and_compare_manifest "$draft_dir" "$release_asset_id"
          if [[ "${upload_status:-0}" -ne 0 ]]; then
            test ! -s "$metadata_dir/release-upload.error"
          fi
          # Reconfirm source and the exact numeric draft immediately before publication.
          verify_source_identity
          get_release_by_id "$release_id"
          check_server_draft "$release_json_path" "$release_id"
          set +e
          bounded_gh 65536 65536 65536 "$metadata_dir/release-edit.log" "$metadata_dir/release-edit.error" 60 \
            gh api --hostname github.com --method PATCH \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --field draft=false "repos/$GITHUB_REPOSITORY/releases/$release_id"
          edit_status=$?
          set -e
          test ! -s "$metadata_dir/release-edit.error"
          final_release_json_path="$RUNNER_TEMP/final-release.json"
          get_release_by_id "$release_id"
          cp -- "$release_json_path" "$final_release_json_path"
          check_server_release "$final_release_json_path" "$release_id"
          if [[ "$edit_status" -ne 0 ]]; then
            test ! -s "$metadata_dir/release-edit.error"
          fi
          release_asset_id="$(jq -er '.assets[0].id | select(type == "number" and . == floor and . > 0)' "$final_release_json_path")"
          final_dir="$RUNNER_TEMP/final-release"
          download_and_compare_manifest "$final_dir" "$release_asset_id"
          verify_registry_digests
