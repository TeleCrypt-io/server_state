name: validate

on:
  push:
    branches: [main]
    tags: ["server-state-*"]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      TELECRYPT_DATA_DIR: /tmp/telecrypt-data
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Require an annotated immutable release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag

      - name: Require release commit to be contained in refreshed main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin refs/heads/main:refs/remotes/origin/main
          release_commit="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
          test "$(git rev-parse HEAD)" = "$release_commit"
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main

      - name: Verify OAuth-only Matrix login ingress
        run: |
          python3 - <<'PY'
          from pathlib import Path

          caddy = Path("Caddyfile").read_text(encoding="utf-8")
          login_deny = "@matrix_compat_login path_regexp ^/_matrix/client/(.*)/login/?$"
          compat_allow = "@mas_compat path_regexp ^/_matrix/client/(.*)/(logout|refresh)/?$"
          assert login_deny in caddy
          assert compat_allow in caddy
          assert caddy.index(login_deny) < caddy.index(compat_allow)
          assert "(login|logout|refresh)" not in caddy
          assert "@mas path /auth /auth/*" in caddy
          PY

      - name: Verify canonical Plan action ingress
        run: |
          python3 - <<'PY'
          from pathlib import Path

          caddy = Path("Caddyfile").read_text(encoding="utf-8")
          plan_routes = "@plan path /plan /plan/* /api/plan /api/plan/*"
          assert plan_routes in caddy
          start = caddy.index(plan_routes)
          route = caddy[start:caddy.index("\n\t}", start) + 3]
          assert "reverse_proxy steward:9012" in route
          assert "reverse_proxy cashier:9011" not in route
          PY

      - name: Verify exact Controlplane release selection
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          compose = Path("compose.yml").read_text(encoding="utf-8")
          expected = None
          for service in ("controlplane", "janitor", "steward"):
              block = re.search(
                  rf"^  {service}:\n(?P<body>.*?)(?=^  [a-z][a-z0-9_-]*:|\Z)",
                  compose,
                  flags=re.MULTILINE | re.DOTALL,
              )
              assert block, f"missing {service} service"
              selected = re.search(
                  r"image: (ghcr\.io/telecrypt-io/controlplane:[0-9]+\.[0-9]+\.[0-9]+)$",
                  block.group("body"),
                  flags=re.MULTILINE,
              )
              assert selected, f"{service} must use an exact Controlplane release"
              expected = expected or selected.group(1)
              assert selected.group(1) == expected, f"{service} does not use {expected}"
          images = re.findall(r"image: (ghcr.io/telecrypt-io/controlplane:[^\s]+)", compose)
          assert images == [expected] * 3, images
          PY

      - name: Verify exact Synapse and MAS release selection
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          compose = Path("compose.yml").read_text(encoding="utf-8")
          expected = {
              "synapse": re.compile(
                  r"ghcr\.io/telecrypt-io/telecrypt-synapse:\d+\.\d+-tc\d+$"
              ),
              "mas": re.compile(
                  r"ghcr\.io/element-hq/matrix-authentication-service:\d+\.\d+\.\d+$"
              ),
          }
          for service, pattern in expected.items():
              block = re.search(
                  rf"^  {service}:\n(?P<body>.*?)(?=^  [a-z][a-z0-9_-]*:|\Z)",
                  compose,
                  flags=re.MULTILINE | re.DOTALL,
              )
              assert block, f"missing {service} service"
              images = re.findall(
                  r"^\s+image: ([^\s]+)$",
                  block.group("body"),
                  flags=re.MULTILINE,
              )
              assert len(images) == 1 and pattern.fullmatch(images[0]), (service, images)
          PY

      - name: Verify environment parameterization and Caddy privilege contract
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          env_example = Path(".env.example").read_text(encoding="utf-8")
          required = (
              "TELECRYPT_DATA_DIR",
              "SERVER_NAME",
              "BACKEND_HOST",
              "BILLING_ENV",
              "INGRESS_BIND_ADDRESS",
              "TRUSTED_PROXY",
          )
          for key in required:
              assert len(re.findall(rf"^{key}=", env_example, flags=re.MULTILINE)) == 1, key

          compose = Path("compose.yml").read_text(encoding="utf-8")
          caddy = re.search(
              r"^  caddy:\n(?P<body>.*?)(?=^  [a-z][a-z0-9_-]*:|\Z)",
              compose,
              flags=re.MULTILINE | re.DOTALL,
          )
          assert caddy, "missing caddy service"
          caddy_body = caddy.group("body")
          for key in ("TRUSTED_PROXY", "SERVER_NAME", "BACKEND_HOST"):
              assert re.search(rf"^\s+- {key}=", caddy_body, flags=re.MULTILINE), key
          assert ":8080:8080\"" in caddy_body, "Caddy must use the fixed unprivileged host/container port"
          assert "NET_BIND_SERVICE" not in caddy_body
          assert 'user: "65532:65532"' in caddy_body
          assert "read_only: true" in caddy_body
          assert "/config/caddy:uid=65532,gid=65532,mode=0700" in caddy_body
          assert "/data/caddy:uid=65532,gid=65532,mode=0700" in caddy_body

          caddyfile = Path("Caddyfile").read_text(encoding="utf-8")
          consumed = set(re.findall(r"\{\$([A-Z][A-Z0-9_]*)\}", caddyfile))
          declared = set(re.findall(r"^\s+- ([A-Z][A-Z0-9_]*)=", caddy_body, flags=re.MULTILINE))
          assert consumed - declared <= {"DODO_WEBHOOK_PATH"}, consumed - declared
          assert "ingress.secrets.env" in caddy_body
          assert "DODO_WEBHOOK_PATH" in caddyfile
          assert "http://{$SERVER_NAME}:8080" in caddyfile
          assert "http://{$BACKEND_HOST}:8080" in caddyfile

          for value in ("SERVER_NAME=telecrypt.io", "BACKEND_HOST=backend.telecrypt.io"):
              assert value not in compose, value
          for stale in (
              "MATRIX_DEPLOYMENT_ID",
              "HOMESERVER",
              "MAS_BASE_URL",
              "PUBLIC_SITE_HOST",
              "INGRESS_PORT",
              "MAS_PUBLIC_URL",
              "PLAN_URL",
              "MAS_ADMIN_URL",
              "MAS_INTERNAL_URL",
              "PLAN_PUBLIC_URL",
              "RUN_ONCE",
              "DODO_API_BASE",
              "TELECRYPT_SECRETS_DIR",
              "CONTROLPLANE_DB_URL",
          ):
              assert stale not in env_example, stale
              assert stale not in compose, stale
              assert stale not in caddyfile, stale
          for stale in ("lkjwt", "livekit", "LIVEKIT_", "voip"):
              marker = stale.lower()
              assert marker not in compose.lower(), stale
              assert marker not in env_example.lower(), stale
              assert marker not in caddyfile.lower(), stale
          for site in ("http://telecrypt.io", "http://backend.telecrypt.io"):
              assert site not in caddyfile, site
          assert "redir https://www.telecrypt.io{uri} 301" in caddyfile
          synapse = Path("synapse.yaml").read_text(encoding="utf-8")
          assert not re.search(r"^\s*(server_name|public_baseurl):", synapse, flags=re.MULTILINE)
          mas = Path("mas.yaml").read_text(encoding="utf-8")
          assert not re.search(r"^\s*(public_base|issuer):", mas, flags=re.MULTILINE)
          assert not re.search(r"^\s*plan_management_iframe_uri:", mas, flags=re.MULTILINE)
          assert "runtime/synapse.identity.yaml:/runtime-identity.yaml:ro" in compose
          assert "runtime/mas.identity.yaml:/runtime-identity.yaml:ro" in compose
          assert 'command: ["-c", "/homeserver.yaml", "-c", "/runtime-identity.yaml", "-c", "/secrets.yaml"]' in compose
          assert 'command: ["server", "--config=/config.yaml", "--config=/runtime-identity.yaml", "--config=/secrets.yaml"]' in compose
          mas_service = re.search(
              r"^  mas:\n(?P<body>.*?)(?=^  [a-z][a-z0-9_-]*:|\Z)",
              compose,
              flags=re.MULTILINE | re.DOTALL,
          )
          assert mas_service and "read_only: true" in mas_service.group("body")
          controlplane = re.search(
              r"^  controlplane:\n(?P<body>.*?)(?=^  [a-z][a-z0-9_-]*:|\Z)",
              compose,
              flags=re.MULTILINE | re.DOTALL,
          )
          assert controlplane, "missing controlplane service"
          assert "BACKEND_PUBLIC_URL=https://${BACKEND_HOST:?set BACKEND_HOST}" in controlplane.group("body")
          assert "SERVER_NAME=${SERVER_NAME:?set SERVER_NAME}" in controlplane.group("body")
          janitor = re.search(
              r"^  janitor:\n(?P<body>.*?)(?=^  [a-z][a-z0-9_-]*:|\Z)",
              compose,
              flags=re.MULTILINE | re.DOTALL,
          )
          assert janitor, "missing janitor service"
          assert "BILLING_ENV=${BILLING_ENV:?set BILLING_ENV}" in janitor.group("body")
          assert "SERVER_NAME=${SERVER_NAME:?set SERVER_NAME}" in janitor.group("body")
          assert "EXCLUDE_MXIDS" not in janitor.group("body")
          steward = re.search(
              r"^  steward:\n(?P<body>.*?)(?=^  [a-z][a-z0-9_-]*:|\Z)",
              compose,
              flags=re.MULTILINE | re.DOTALL,
          )
          assert steward and "BACKEND_PUBLIC_URL=https://${BACKEND_HOST:?set BACKEND_HOST}" in steward.group("body")
          cashier = re.search(
              r"^  cashier:\n(?P<body>.*?)(?=^  [a-z][a-z0-9_-]*:|\Z)",
              compose,
              flags=re.MULTILINE | re.DOTALL,
          )
          assert cashier and "BACKEND_PUBLIC_URL=https://${BACKEND_HOST:?set BACKEND_HOST}" in cashier.group("body")
          assert compose.count("BILLING_ENV=${BILLING_ENV:?set BILLING_ENV}") == 3
          assert "BILLING_ENV=test" not in compose
          assert "live.dodopayments.com" not in compose
          assert caddyfile.count('request>uri regexp "[?].*" "?[REDACTED]"') == 1
          assert caddyfile.count("import access_log") == 2
          assert "@dodo_webhook_path path {$DODO_WEBHOOK_PATH}" in caddyfile
          assert "log_skip @dodo_webhook_path" in caddyfile
          PY

      - name: Validate Compose
        run: |
          mkdir -p "$TELECRYPT_DATA_DIR/secrets" "$TELECRYPT_DATA_DIR"
          install -m 600 /dev/null "$TELECRYPT_DATA_DIR/secrets/locker.secrets.env"
          install -m 600 /dev/null "$TELECRYPT_DATA_DIR/secrets/steward.secrets.env"
          install -m 600 /dev/null "$TELECRYPT_DATA_DIR/secrets/cashier.secrets.env"
          DODO_WEBHOOK_PATH="$(python3 -c 'import secrets; print("/webhook-dodo-" + secrets.token_hex(32))')"
          printf '%s\n' "DODO_WEBHOOK_PATH=$DODO_WEBHOOK_PATH" > "$TELECRYPT_DATA_DIR/secrets/ingress.secrets.env"
          chmod 600 "$TELECRYPT_DATA_DIR/secrets/ingress.secrets.env"
          docker compose --env-file .env.example config --quiet

      - name: Verify exact selected and published container artifacts
        run: |
          set -euo pipefail
          images_file="$(mktemp)"
          auth_file="$(mktemp)"
          trap 'rm -f "$images_file" "$auth_file"' EXIT
          docker compose --env-file .env.example config --images | sort -u > "$images_file"
          python3 - "$images_file" <<'PY'
          import sys
          from pathlib import Path

          import re

          repositories = {
              "ghcr.io/telecrypt-io/telecrypt-synapse": re.compile(r"\d+\.\d+-tc\d+"),
              "ghcr.io/telecrypt-io/controlplane": re.compile(r"\d+\.\d+\.\d+"),
              "ghcr.io/telecrypt-io/telecrypt-cashier": re.compile(r"\d+\.\d+\.\d+"),
              "ghcr.io/element-hq/matrix-authentication-service": re.compile(r"\d+\.\d+\.\d+"),
              "docker.io/caddy": re.compile(r"\d+\.\d+\.\d+-alpine"),
          }
          images = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          assert len(images) == len(repositories), images
          selected = {}
          for image in images:
              repository, tag = image.rsplit(":", 1)
              assert repository in repositories, f"unexpected image repository: {repository}"
              assert repositories[repository].fullmatch(tag), f"{repository} must use an exact release tag"
              assert repository not in selected, f"duplicate {repository} image"
              selected[repository] = tag
          assert set(selected) == set(repositories), selected
          PY
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            command -v skopeo
            printf '%s' "$GHCR_TOKEN" | skopeo login \
              --authfile "$auth_file" \
              --username "$GITHUB_ACTOR" \
              --password-stdin \
              ghcr.io
            while IFS= read -r image; do
              case "$image" in
                ghcr.io/telecrypt-io/telecrypt-cashier:*)
                  contract_label="$(skopeo inspect --authfile "$auth_file" \
                    --format '{{ index .Labels "io.telecrypt.config-contract" }}' \
                    "docker://$image")"
                  test "$contract_label" = "1"
                  echo "Verified Cashier config contract label on $image"
                  continue
                  ;;
                ghcr.io/telecrypt-io/controlplane:*)
                  contract_label="$(skopeo inspect --format '{{ index .Labels "io.telecrypt.config-contract" }}' "docker://$image")"
                  test "$contract_label" = "1"
                  echo "Verified Controlplane config contract label on $image"
                  ;;
                *)
                  echo "Inspecting $image"
                  skopeo inspect --no-tags "docker://$image" >/dev/null
                  ;;
              esac
            done < "$images_file"
          fi
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Caddy
        run: |
          caddy_image="$(docker compose --env-file .env.example config --images | awk '/docker.io\/caddy:/ { print; exit }')"
          test -n "$caddy_image"
          docker run --rm \
            --user 65532:65532 \
            --read-only \
            --tmpfs /config/caddy:uid=65532,gid=65532,mode=0700 \
            --tmpfs /data/caddy:uid=65532,gid=65532,mode=0700 \
            --env TRUSTED_PROXY=127.0.0.1/32 \
            --env SERVER_NAME=example.invalid \
            --env BACKEND_HOST=backend.example.invalid \
            --env-file /tmp/telecrypt-data/secrets/ingress.secrets.env \
            --volume "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$caddy_image" caddy validate --config /etc/caddy/Caddyfile

      - name: Verify pinned standalone Synapse image
        # Pull requests check the declared image contract; main and tag runs verify the published
        # exact tag.
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          synapse_image="$(docker compose --env-file .env.example config --images | awk '/telecrypt-synapse/ { print; exit }')"
          test -n "$synapse_image"
          labels_file="$(mktemp)"
          trap 'rm -f "$labels_file"' EXIT
          skopeo inspect --format '{{json .Labels}}' "docker://$synapse_image" > "$labels_file"
          python3 - "$synapse_image" "$labels_file" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          image, labels_path = sys.argv[1:]
          labels = json.loads(Path(labels_path).read_text(encoding="utf-8"))
          assert isinstance(labels, dict), labels
          tag = image.rsplit(":", 1)[1]
          exact = {
              "org.opencontainers.image.source": "https://github.com/TeleCrypt-io/telecrypt-synapse",
              "org.opencontainers.image.version": tag,
              "org.opencontainers.image.base.name": "ghcr.io/element-hq/synapse",
          }
          for key, value in exact.items():
              assert labels.get(key) == value, (key, labels.get(key), value)
          for key in (
              "org.opencontainers.image.base.version",
              "org.telecrypt.s3-provider.version",
              "org.telecrypt.controlplane.release",
          ):
              value = labels.get(key, "")
              assert re.fullmatch(r"v?\d+\.\d+\.\d+", value), (key, value)
          PY
          docker run --rm \
            --entrypoint python \
            "$synapse_image" \
            -c 'from tier_controller import TierController; print(TierController.__name__)'
