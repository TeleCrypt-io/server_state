name: validate

on:
  push:
    branches: [main]
    tags: ["server-state-*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate Compose
        env:
          TELECRYPT_SECRETS_DIR: /tmp/telecrypt-secrets
          TELECRYPT_DATA_DIR: /tmp/telecrypt-data
        run: |
          mkdir -p "$TELECRYPT_SECRETS_DIR" "$TELECRYPT_DATA_DIR"
          touch "$TELECRYPT_SECRETS_DIR/locker.secrets.env"
          touch "$TELECRYPT_SECRETS_DIR/steward.secrets.env"
          touch "$TELECRYPT_SECRETS_DIR/cashier.secrets.env"
          printf '%s\n' 'DODO_WEBHOOK_PATH=/webhook-dodo-ci-only' > "$TELECRYPT_SECRETS_DIR/ingress.secrets.env"
          docker compose --env-file .env.example config --quiet

      - name: Validate Caddy
        run: |
          docker run --rm --env DODO_WEBHOOK_PATH=/webhook-dodo-ci-only \
            --volume "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            docker.io/caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Verify pinned standalone Synapse image
        # A server PR is opened before the coordinated component releases exist. The image-builder
        # workflow tests this target; server verifies the published exact tag on main/tag runs.
        if: github.event_name != 'pull_request'
        run: >-
          docker run --rm
          --entrypoint python
          ghcr.io/telecrypt-io/telecrypt-synapse:1.155-tc1
          -c 'from tier_controller import TierController; print(TierController.__name__)'
