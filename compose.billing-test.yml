# Full-stack billing sandbox override.
#
# Run only with a dedicated Compose project, test-only secrets/data directories, and the
# billing-test profile. This does not share Matrix, MAS, Synapse, janitor, PostgreSQL, media,
# OIDC, or Dodo state with the production-shaped base stack.
services:
  caddy:
    container_name: tc_billing_test_caddy
    volumes:
      - ./Caddyfile.billing-test:/etc/caddy/Caddyfile:ro

  synapse:
    container_name: tc_billing_test_synapse
    volumes:
      - ./synapse/homeserver.billing-test.yaml:/homeserver.yaml:ro

  mas:
    container_name: tc_billing_test_mas
    volumes:
      - ./mas/config.billing-test.yaml:/config.yaml:ro
      - ./synapse/homeserver.billing-test.yaml:/homeserver.yaml:ro

  redpill:
    container_name: tc_billing_test_redpill
    environment:
      - MAS_BASE_URL=https://backend.test.telecrypt.io/auth
      - HOMESERVER=https://backend.test.telecrypt.io
      - SERVER_NAME=test.telecrypt.io
      - IGNORED_PROXY_IP=${IGNORED_PROXY_IP:-}

  janitor:
    container_name: tc_billing_test_janitor
    environment:
      - RUN_ONCE=1
      - SERVER_NAME=test.telecrypt.io
      - MAS_BASE_URL=http://mas:8080
      - EXCLUDE_MXIDS=@cashier_admin:test.telecrypt.io
      - LOCK_AFTER_HOURS=48

  cashier:
    container_name: tc_billing_test_cashier
    profiles: ["billing-test"]
    environment:
      - SERVER_NAME=test.telecrypt.io
      - MATRIX_DEPLOYMENT_ID=billing-test
      - SYNAPSE_ADMIN_URL=http://synapse:8008
      - HOMESERVER=https://backend.test.telecrypt.io
      - MAS_BASE_URL=http://mas:8080
      - PLAN_PUBLIC_URL=https://backend.test.telecrypt.io/plan

  lkjwt:
    container_name: tc_billing_test_lkjwt
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL:-__CHANGEME__}
      - LIVEKIT_KEY=${LIVEKIT_KEY:-__CHANGEME__}
      - LIVEKIT_SECRET=${LIVEKIT_SECRET:-__CHANGEME__}
      - LIVEKIT_FULL_ACCESS_HOMESERVERS=test.telecrypt.io
      - LIVEKIT_JWT_BIND=:8080

networks:
  telecrypt_net:
    name: telecrypt_billing_test_net
