# TeleCrypt.io — Matrix stack: Synapse + MAS (MSC3861, local accounts).
#
# Design:
#   - Rootless Docker. Apps drop to uid/gid 991; no privileged host ports.
#   - TLS is terminated by an UPSTREAM reverse proxy; the shared Caddy speaks plain HTTP.
#   - Persistent state and real secrets live outside this repository under TELECRYPT_DATA_DIR.
#   - Synapse and MAS merge committed base config, private JSON config, and Harness runtime
#     identity last, so private overlays cannot replace public identity.
#   - Caddy reaches each public upstream over its own edge network; private peers use separate
#     purpose-specific networks and egress is isolated per service where required. Compose's
#     `gw_priority: 1` is used only on the five non-internal egress attachments below and requires
#     Docker Engine 28+ with Compose 2.33.1+.
#   - MAS uses supported IPv4 socket-address binds for its separate web and internal/admin listeners;
#     MAS and Janitor share a deterministic /29 private admin network for Janitor's operation, and
#     no MAS port is published on the host. Every project network has an explicit, unique IPAM
#     subnet so Docker's daemon-wide default address pool cannot overlap the host/VPN routes.
#   - Media is stored in external S3; PostgreSQL is external to this Compose project.

services:

  # ── Ingress: Caddy — plain HTTP only (NO TLS; auto_https off). HAProxy terminates TLS. ────────
  caddy:
    # Exact tested release tag; no digest pin by operator preference. Keep `-alpine` —
    # `caddy:2`/`latest` is the larger Debian image. Upgrade deliberately after validation.
    image: ${CADDY_IMAGE:?set CADDY_IMAGE}
    restart: unless-stopped
    networks:
      caddy_ingress_net:
      edge_synapse_net:
      edge_mas_net:
      edge_registration_net:
      edge_plan_net:
      edge_cashier_net:
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # The official image's Caddy executable carries NET_BIND_SERVICE as a file capability.
    # Retain only that exact in-container capability so it can execute under cap_drop ALL;
    # it does not grant host-level port authority and is not given to any other service.
    cap_add: ["NET_BIND_SERVICE"]
    read_only: true
    user: "65532:65532"
    tmpfs:
      - /config/caddy:uid=65532,gid=65532,mode=0700
      - /data/caddy:uid=65532,gid=65532,mode=0700
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    ports:
      # Set INGRESS_BIND_ADDRESS in the server-only .env to the dedicated proxy-facing VM address.
      # The loopback default fails closed for a fresh checkout.
      - target: 8080
        published: 8080
        host_ip: ${INGRESS_BIND_ADDRESS:?set INGRESS_BIND_ADDRESS}
        protocol: tcp
        mode: ingress
    environment:
      - TRUSTED_PROXY=${TRUSTED_PROXY:?set TRUSTED_PROXY}
      - SERVER_NAME=${SERVER_NAME:?set SERVER_NAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - synapse
      - mas
    # No healthcheck: liveness is monitored by HAProxy's backend `check`.

  # ── Matrix homeserver (TeleCrypt Synapse + exact external policy/S3 components) ─────────────
  synapse:
    # This image's reviewed operational tag carries the pinned TeleCrypt Synapse and S3-provider
    # forks plus the Controlplane policy wheel. Do not replace it with a bind mount or a startup
    # package install.
    image: ${SYNAPSE_IMAGE:?set SYNAPSE_IMAGE}
    restart: unless-stopped
    networks:
      edge_synapse_net:
      synapse_mas_net:
      synapse_egress_net:
        gw_priority: 1
      cashier_synapse_net:
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    user: "991:991"
    tmpfs:
      - /tmp:uid=991,gid=991,mode=1777,size=16m
    # Bypass the image's start.py so we can merge public base, private config, and SERVER_NAME-derived
    # runtime identity last; the final layer owns the public identity fields.
    entrypoint: ["/telecrypt-synapse-entrypoint"]
    command: ["-c", "/homeserver.yaml", "-c", "/secrets.json", "-c", "/runtime-identity.yaml"]
    volumes:
      - ./synapse.yaml:/homeserver.yaml:ro
      - ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/runtime/synapse.identity.yaml:/runtime-identity.yaml:ro
      - ./synapse.log.config:/log.config:ro
      - ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/runtime/synapse-staging:/staging:rw
    secrets:
      - source: synapse_secrets_json
        target: /secrets.json
      - source: synapse_signing_key
        target: /signing.key
    environment:
      - TMPDIR=/staging/tmp
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mas:
        condition: service_started

  # ── Matrix Authentication Service (MSC3861). Publicly served under /auth by Caddy. ───────────
  mas:
    image: ${MAS_IMAGE:?set MAS_IMAGE}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # MAS stores application state in external PostgreSQL; the official image has no writable
    # data volume or filesystem contract, so deny root-filesystem writes at runtime.
    read_only: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    user: "991:991"
    # MAS's repeated --config files merge in order; keep the Harness identity layer last so the
    # private secret overlay cannot replace public identity.
    command: ["server", "--config=/config.yaml", "--config=/secrets.json", "--config=/runtime-identity.yaml"]
    healthcheck:
      # The distroless image has no shell or HTTP client. This validates every config layer;
      # Harness performs OIDC discovery and Plan readiness checks separately.
      test: ["CMD", "/usr/local/bin/mas-cli", "config", "check", "--config=/config.yaml", "--config=/secrets.json", "--config=/runtime-identity.yaml"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./mas.yaml:/config.yaml:ro
      - ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/runtime/mas.identity.yaml:/runtime-identity.yaml:ro
    networks:
      edge_mas_net:
      synapse_mas_net:
      mas_egress_net:
        gw_priority: 1
      plan_mas_net:
      # Janitor's fixed endpoint name; this alias is name resolution only, not a MAS bind host.
      mas_admin_net:
        aliases:
          - mas-admin
        ipv4_address: 192.168.254.2
    secrets:
      - source: mas_secrets_json
        target: /secrets.json

  # ── registration: public agent-registration shim (POST /agents only, routed by Caddy). Privilege
  # boundary: holds NO credentials of any kind. It drives MAS's public
  # registration form and public/native-client OAuth device flow over its dedicated networks; it never
  # mints a Matrix password token or calls m.login.password. ────────────────────────────────────
  # The exact Controlplane image defaults to Registration; the deployment boundary keeps the
  # component-specific service name and command contract explicit below.
  registration:
    image: ${CONTROLPLANE_IMAGE:?set CONTROLPLANE_IMAGE}
    restart: unless-stopped
    networks:
      edge_registration_net:
      registration_egress_net:
        gw_priority: 1
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    user: "991:991"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      - SERVER_NAME=${SERVER_NAME:?set SERVER_NAME}
    depends_on:
      mas:
        condition: service_started

  # ── janitor: the ONE component holding a standing MAS admin credential (lock stale
  # unclaimed accounts + owner sign-up digest). Same image, different command. No listening
  # port, no Caddy route, zero inbound surface. The source derives the cashier-admin exclusion
  # from SERVER_NAME; this repository provides no scheduler, so the profile is invoked explicitly
  # by the owner/Harness orchestration after readiness checks. ───────────────────────────────────
  janitor:
    image: ${CONTROLPLANE_IMAGE:?set CONTROLPLANE_IMAGE}
    restart: "no"
    # This one-shot is intentionally excluded from the default stack start. Harness starts the
    # profile only after Harness completes its OIDC discovery and Plan readiness checks.
    profiles: [janitor]
    # mas_admin_net is Janitor's dedicated MAS application path; its database/SMTP egress is
    # isolated on its own external network.
    networks:
      mas_admin_net:
      janitor_egress_net:
        gw_priority: 1
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    user: "991:991"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    command: ["/janitor"]
    environment:
      - SERVER_NAME=${SERVER_NAME:?set SERVER_NAME}
      - BILLING_ENVIRONMENT=${BILLING_ENVIRONMENT:?set BILLING_ENVIRONMENT}
      - MAS_ADMIN_CLIENT_ID=${MAS_ADMIN_CLIENT_ID:?set MAS_ADMIN_CLIENT_ID}
      - MAS_ADMIN_CLIENT_SECRET=${MAS_ADMIN_CLIENT_SECRET:?set MAS_ADMIN_CLIENT_SECRET}
      - JANITOR_DB_URL=${JANITOR_DB_URL:?set JANITOR_DB_URL}
      # Dry-run mode is an explicit safety switch; Controlplane rejects missing, empty, or invalid
      # values; test billing profiles may use dry-run, while live billing may not.
      - OWNER_EMAIL=${OWNER_EMAIL:-}
      - JANITOR_DRY_RUN=${JANITOR_DRY_RUN:?set JANITOR_DRY_RUN}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
    depends_on:
      mas:
        condition: service_healthy
      cashier:
        condition: service_healthy

  # ── plan: public browser boundary. It authenticates via MAS and signs narrowly-scoped requests
  # to Cashier; it has no Dodo, Synapse-admin, or database credential. ─────────────────────────
  plan:
    image: ${CONTROLPLANE_IMAGE:?set CONTROLPLANE_IMAGE}
    restart: unless-stopped
    networks:
      edge_plan_net:
      plan_mas_net:
      plan_cashier_net:
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    user: "991:991"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    command: ["/plan"]
    environment:
      - SERVER_NAME=${SERVER_NAME:?set SERVER_NAME}
      - BILLING_ENVIRONMENT=${BILLING_ENVIRONMENT:?set BILLING_ENVIRONMENT}
      - MAS_OIDC_CLIENT_ID=${MAS_OIDC_CLIENT_ID:?set MAS_OIDC_CLIENT_ID}
      - MAS_OIDC_CLIENT_SECRET=${MAS_OIDC_CLIENT_SECRET:?set MAS_OIDC_CLIENT_SECRET}
      - PLAN_SESSION_KEY=${PLAN_SESSION_KEY:?set PLAN_SESSION_KEY}
      - PLAN_ASSERTION_PRIVATE_KEY=${PLAN_ASSERTION_PRIVATE_KEY:?set PLAN_ASSERTION_PRIVATE_KEY}
    depends_on:
      mas:
        condition: service_started

  # ── cashier: private billing authority. Caddy routes only Dodo's signed webhook; Plan reaches
  # its command API on the isolated plan_cashier_net using Ed25519 assertions. Cashier reaches
  # Synapse's fixed internal admin endpoint only through cashier_synapse_net. ───────────────────
  cashier:
    image: ${CASHIER_IMAGE:?set CASHIER_IMAGE}
    restart: unless-stopped
    networks:
      edge_cashier_net:
      plan_cashier_net:
      cashier_synapse_net:
      cashier_egress_net:
        gw_priority: 1
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    user: "991:991"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      - SERVER_NAME=${SERVER_NAME:?set SERVER_NAME}
      - BILLING_ENVIRONMENT=${BILLING_ENVIRONMENT:?set BILLING_ENVIRONMENT}
      - SYNAPSE_ADMIN_TOKEN=${SYNAPSE_ADMIN_TOKEN:?set SYNAPSE_ADMIN_TOKEN}
      - CASHIER_DB_URL=${CASHIER_DB_URL:?set CASHIER_DB_URL}
      - DODO_API_KEY=${DODO_API_KEY:?set DODO_API_KEY}
      - DODO_WEBHOOK_SECRET=${DODO_WEBHOOK_SECRET:?set DODO_WEBHOOK_SECRET}
      - DODO_PRODUCT_ID=${DODO_PRODUCT_ID:?set DODO_PRODUCT_ID}
      - PLAN_ASSERTION_PUBLIC_KEY=${PLAN_ASSERTION_PUBLIC_KEY:?set PLAN_ASSERTION_PUBLIC_KEY}
      # Cashier uses Synapse's fixed internal admin endpoint and has no browser/OIDC routes.
    healthcheck:
      test: ["CMD", "/cashier", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
# Compose file-backed secrets below are populated only by the guarded deployer from the private
# `${TELECRYPT_DATA_DIR}/secrets` contract. They are intentionally outside the operator `.env`.
secrets:
  synapse_secrets_json:
    file: ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/secrets/synapse.secrets.json
  synapse_signing_key:
    file: ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/secrets/synapse_signing.key
  mas_secrets_json:
    file: ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/secrets/mas.secrets.json

# Purpose-specific application networks. Edge and peer networks are internal; egress networks are
# attached only to their documented service. Synapse and MAS keep separate egress paths so neither
# service can reach external destinations through the other's network.
networks:
  # A normal bridge is required for Docker to materialize Caddy's host publish. It is attached
  # only to Caddy; all application-facing edge and peer networks remain internal below.
  caddy_ingress_net:
    ipam:
      config:
        - subnet: 10.254.0.0/28
  edge_synapse_net:
    internal: true
    ipam:
      config:
        - subnet: 10.254.0.16/28
  edge_mas_net:
    internal: true
    ipam:
      config:
        - subnet: 10.254.0.32/28
  edge_registration_net:
    internal: true
    ipam:
      config:
        - subnet: 10.254.0.48/28
  edge_plan_net:
    internal: true
    ipam:
      config:
        - subnet: 10.254.0.64/28
  edge_cashier_net:
    internal: true
    ipam:
      config:
        - subnet: 10.254.0.80/28
  synapse_mas_net:
    internal: true
    ipam:
      config:
        - subnet: 10.254.0.96/28
  synapse_egress_net:
    ipam:
      config:
        - subnet: 10.254.0.112/28
  mas_egress_net:
    ipam:
      config:
        - subnet: 10.254.0.128/28
  cashier_synapse_net:
    internal: true
    ipam:
      config:
        - subnet: 10.254.0.144/28
  plan_mas_net:
    internal: true
    ipam:
      config:
        - subnet: 10.254.0.160/28
  plan_cashier_net:
    internal: true
    ipam:
      config:
        - subnet: 10.254.0.176/28
  registration_egress_net:
    ipam:
      config:
        - subnet: 10.254.0.192/28
  cashier_egress_net:
    ipam:
      config:
        - subnet: 10.254.0.208/28
  janitor_egress_net:
    ipam:
      config:
        - subnet: 10.254.0.224/28
  mas_admin_net:
    internal: true
    ipam:
      config:
        - subnet: 192.168.254.0/29
