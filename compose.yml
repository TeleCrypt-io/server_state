# TeleCrypt.io — Matrix stack: Synapse + MAS (MSC3861, local accounts).
#
# Design:
#   - Rootless Docker. Apps drop to uid/gid 991; no privileged host ports.
#   - TLS is terminated by an UPSTREAM reverse proxy; the shared Caddy speaks plain HTTP.
#   - Persistent state and real secrets live outside this repository.
#   - Each app merges its committed config with a gitignored secrets file at runtime.
#   - Media is stored in external S3; PostgreSQL is external to this Compose project.

services:

  # ── Ingress: Caddy — plain HTTP only (NO TLS; auto_https off). HAProxy terminates TLS. ────────
  caddy:
    # Exact tested release tag; no digest pin by operator preference. Keep `-alpine` —
    # `caddy:2`/`latest` is the larger Debian image. Upgrade deliberately after validation.
    image: docker.io/caddy:2.11.4-alpine
    container_name: tc_caddy
    restart: unless-stopped
    networks: [ telecrypt_net ]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]          # binds :80 in-container
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    ports:
      # Set INGRESS_BIND_ADDRESS in the server-only .env to the dedicated proxy-facing VM address.
      # The loopback default fails closed for a fresh checkout.
      - "${INGRESS_BIND_ADDRESS:-127.0.0.1}:${INGRESS_PORT:-8080}:80"
    environment:
      - TRUSTED_PROXY=${TRUSTED_PROXY:-127.0.0.1/32}
    # Contains only DODO_WEBHOOK_PATH, not a Dodo API key or webhook signature secret.
    env_file:
      - ${TELECRYPT_SECRETS_DIR:?set TELECRYPT_SECRETS_DIR}/ingress.secrets.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - synapse
      - mas
    # No healthcheck: liveness is monitored by HAProxy's backend `check`.

  # ── Matrix homeserver (official Synapse + exact external policy/S3 components) ───────────────
  synapse:
    # `1.155-tc1` is this image's immutable operational tag. Its OCI provenance records Synapse
    # 1.155.0, Matrix.org S3 provider 1.6.1, and its bundled policy-module wheel; that provenance
    # is independent of the Controlplane application release selected below. Do not replace it with
    # a bind mount or a startup package install.
    image: ghcr.io/telecrypt-io/telecrypt-synapse:1.155-tc1
    container_name: tc_synapse
    restart: unless-stopped
    networks: [ telecrypt_net ]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    user: "991:991"
    # Bypass the image's start.py so we can merge base config + gitignored secrets (two -c files).
    entrypoint: ["python", "-m", "synapse.app.homeserver"]
    command: ["-c", "/homeserver.yaml", "-c", "/secrets.yaml"]
    volumes:
      - ./synapse.yaml:/homeserver.yaml:ro
      - ./synapse.log.config:/log.config:ro
      - ${TELECRYPT_SECRETS_DIR:?set TELECRYPT_SECRETS_DIR}/synapse.secrets.yaml:/secrets.yaml:ro
      - ${TELECRYPT_SECRETS_DIR:?set TELECRYPT_SECRETS_DIR}/synapse_signing.key:/signing.key:ro
      - ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/synapse/media_store:/data:rw
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mas:
        condition: service_started

  # ── Matrix Authentication Service (MSC3861). Served under https://backend.telecrypt.io/auth/ ─
  mas:
    image: ghcr.io/element-hq/matrix-authentication-service:1.16.0
    container_name: tc_mas
    restart: unless-stopped
    networks: [ telecrypt_net ]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    user: "991:991"
    command: ["server", "--config=/config.yaml", "--config=/secrets.yaml"]
    environment:
      - RUST_LOG=info
    volumes:
      - ./mas.yaml:/config.yaml:ro
      - ./synapse.yaml:/homeserver.yaml:ro
      - ${TELECRYPT_SECRETS_DIR:?set TELECRYPT_SECRETS_DIR}/mas.secrets.yaml:/secrets.yaml:ro

  # ── controlplane: public agent-registration shim (POST /redpill only, routed by Caddy). Privilege
  # boundary: holds NO credentials of any kind — no env_file at all. It drives MAS's public
  # registration form and public/native-client OAuth device flow over telecrypt_net; it never
  # mints a Matrix compatibility token or calls m.login.password. (morpheus is gone entirely;
  # see the controlplane repo README.) ─────────────────────────────────────────────────────────
  controlplane:
    image: ghcr.io/telecrypt-io/controlplane:0.3.19
    container_name: tc_controlplane
    restart: unless-stopped
    networks: [ telecrypt_net ]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    user: "991:991"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      # Registration redirects must use MAS's browser-visible public base URL.
      - MAS_BASE_URL=https://backend.telecrypt.io/auth
      - HOMESERVER=https://backend.telecrypt.io
      # SERVER_NAME keeps MXIDs at @agent:telecrypt.io even though HOMESERVER is backend.
      - SERVER_NAME=telecrypt.io
      - IGNORED_PROXY_IP=${IGNORED_PROXY_IP:-}
    depends_on:
      mas:
        condition: service_started

  # ── janitor: the ONE component holding a standing MAS admin credential (lock stale
  # unclaimed accounts + owner sign-up digest). Same image, different entrypoint. No listening
  # port, no Caddy route, zero inbound surface. Invoked daily via systemd timer (RUN_ONCE=1). ──
  janitor:
    image: ghcr.io/telecrypt-io/controlplane:0.3.19
    container_name: tc_janitor
    restart: "no"
    networks: [ telecrypt_net ]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    user: "991:991"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    command: ["/janitor"]
    environment:
      - RUN_ONCE=1
      - BILLING_ENV=test
      - MATRIX_DEPLOYMENT_ID=production
      - SERVER_NAME=telecrypt.io
      - MAS_BASE_URL=http://mas:8080
      - EXCLUDE_MXIDS=@cashier_admin:telecrypt.io
      - LOCK_AFTER_HOURS=48
    # locker.secrets.env: MAS_ADMIN_CLIENT_ID/SECRET, CONTROLPLANE_DB_URL, OWNER_EMAIL, SMTP_*.
    # env_file is read by the rootless Compose operator, not by the container uid.
    env_file:
      - ${TELECRYPT_SECRETS_DIR:?set TELECRYPT_SECRETS_DIR}/locker.secrets.env
    depends_on:
      mas:
        condition: service_started

  # ── steward: public browser boundary. It authenticates via MAS and signs narrowly-scoped requests
  # to Cashier; it has no Dodo, Synapse-admin, or database credential. ─────────────────────────
  steward:
    image: ghcr.io/telecrypt-io/controlplane:0.3.19
    container_name: tc_steward
    restart: unless-stopped
    networks: [ telecrypt_net, cashier_plan_net ]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    user: "991:991"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    command: ["/steward"]
    environment:
      - BILLING_ENV=test
      - SERVER_NAME=telecrypt.io
      - HOMESERVER=https://backend.telecrypt.io
      - MAS_BASE_URL=http://mas:8080
      - PLAN_PUBLIC_URL=https://backend.telecrypt.io/plan
      - CASHIER_INTERNAL_URL=http://cashier:9011
    env_file:
      - ${TELECRYPT_SECRETS_DIR:?set TELECRYPT_SECRETS_DIR}/steward.secrets.env
    depends_on:
      mas:
        condition: service_started

  # ── cashier: private billing authority. Caddy routes only Dodo's signed webhook; Plan reaches
  # its command API on the isolated cashier_plan_net using Ed25519 assertions. ───────────────────
  cashier:
    image: ghcr.io/telecrypt-io/telecrypt-cashier:0.2.2
    container_name: tc_cashier
    restart: unless-stopped
    networks: [ telecrypt_net, cashier_plan_net ]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    user: "991:991"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      - SERVER_NAME=telecrypt.io
      - MATRIX_DEPLOYMENT_ID=production
      # Synapse's admin API stays on telecrypt_net. Cashier has no browser/OIDC routes.
      - SYNAPSE_ADMIN_URL=http://synapse:8008
      - HOMESERVER=https://backend.telecrypt.io
      - MAS_BASE_URL=http://mas:8080
      - PLAN_PUBLIC_URL=https://backend.telecrypt.io/plan
    env_file:
      - ${TELECRYPT_SECRETS_DIR:?set TELECRYPT_SECRETS_DIR}/cashier.secrets.env
    depends_on:
      mas:
        condition: service_started

  # ── lkjwt: LiveKit JWT service (Element Call). Staged off — only activate with
  # `docker compose --profile voip up -d` after the LiveKit SFU, its webhook, Caddy route, and
  # Matrix well-known RTC focus are wired. Version is deliberately an exact release tag.
  lkjwt:
    image: ghcr.io/element-hq/lk-jwt-service:0.5.0
    profiles: ["voip"]
    container_name: tc_lkjwt
    restart: "no"
    networks: [ telecrypt_net ]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    user: "991:991"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL:-__CHANGEME__}
      - LIVEKIT_KEY=${LIVEKIT_KEY:-__CHANGEME__}
      - LIVEKIT_SECRET=${LIVEKIT_SECRET:-__CHANGEME__}
      # Never use `*`: only local TeleCrypt users may create LiveKit rooms.
      - LIVEKIT_FULL_ACCESS_HOMESERVERS=telecrypt.io
      - LIVEKIT_JWT_BIND=:8080
    depends_on: {}

# Shared application network.
networks:
  telecrypt_net:
    name: telecrypt_net
    driver: bridge
  cashier_plan_net:
    internal: true
