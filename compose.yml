# TeleCrypt.io — Matrix stack: Synapse + MAS (MSC3861, local accounts).
#
# Design:
#   - Rootless Docker. Apps drop to uid/gid 991; no privileged host ports.
#   - TLS is terminated by an UPSTREAM reverse proxy; the shared Caddy speaks plain HTTP.
#   - Persistent state and real secrets live outside this repository under TELECRYPT_DATA_DIR.
#   - Synapse and MAS merge committed base config, Harness runtime identity, and private secret
#     config at runtime.
#   - Media is stored in external S3; PostgreSQL is external to this Compose project.

services:

  # ── Ingress: Caddy — plain HTTP only (NO TLS; auto_https off). HAProxy terminates TLS. ────────
  caddy:
    # Exact tested release tag; no digest pin by operator preference. Keep `-alpine` —
    # `caddy:2`/`latest` is the larger Debian image. Upgrade deliberately after validation.
    image: docker.io/caddy:2.11.4-alpine
    container_name: tc_caddy
    restart: unless-stopped
    networks: [ telecrypt_net ]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    user: "65532:65532"
    tmpfs:
      - /config/caddy:uid=65532,gid=65532,mode=0700
      - /data/caddy:uid=65532,gid=65532,mode=0700
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    ports:
      # Set INGRESS_BIND_ADDRESS in the server-only .env to the dedicated proxy-facing VM address.
      # The loopback default fails closed for a fresh checkout.
      - "${INGRESS_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    environment:
      - TRUSTED_PROXY=${TRUSTED_PROXY:-127.0.0.1/32}
      - SERVER_NAME=${SERVER_NAME:?set SERVER_NAME}
      - BACKEND_HOST=${BACKEND_HOST:?set BACKEND_HOST}
    # Contains only DODO_WEBHOOK_PATH, not a Dodo API key or webhook signature secret.
    env_file:
      - ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/secrets/ingress.secrets.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - synapse
      - mas
    # No healthcheck: liveness is monitored by HAProxy's backend `check`.

  # ── Matrix homeserver (official Synapse + exact external policy/S3 components) ───────────────
  synapse:
    # `1.159-tc2` is this image's immutable operational tag. Its OCI provenance records Synapse
    # 1.159.0, Matrix.org S3 provider 1.7.0, and Controlplane policy wheel 0.4.0; that provenance
    # is independent of the Controlplane application release selected below. Do not replace it with
    # a bind mount or a startup package install.
    image: ghcr.io/telecrypt-io/telecrypt-synapse:1.159-tc2
    container_name: tc_synapse
    restart: unless-stopped
    networks: [ telecrypt_net ]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    user: "991:991"
    # Bypass the image's start.py so we can merge public base, runtime identity, and private config.
    entrypoint: ["python", "-m", "synapse.app.homeserver"]
    command: ["-c", "/homeserver.yaml", "-c", "/runtime-identity.yaml", "-c", "/secrets.yaml"]
    volumes:
      - ./synapse.yaml:/homeserver.yaml:ro
      - ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/runtime/synapse.identity.yaml:/runtime-identity.yaml:ro
      - ./synapse.log.config:/log.config:ro
      - ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/secrets/synapse.secrets.yaml:/secrets.yaml:ro
      - ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/secrets/synapse_signing.key:/signing.key:ro
      - ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/synapse/media_store:/data:rw
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mas:
        condition: service_started

  # ── Matrix Authentication Service (MSC3861). Publicly served under /auth by Caddy. ───────────
  mas:
    image: ghcr.io/element-hq/matrix-authentication-service:1.23.0
    container_name: tc_mas
    restart: unless-stopped
    networks: [ telecrypt_net ]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # MAS stores application state in external PostgreSQL; the official image has no writable
    # data volume or filesystem contract, so deny root-filesystem writes at runtime.
    read_only: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    user: "991:991"
    command: ["server", "--config=/config.yaml", "--config=/runtime-identity.yaml", "--config=/secrets.yaml"]
    volumes:
      - ./mas.yaml:/config.yaml:ro
      - ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/runtime/mas.identity.yaml:/runtime-identity.yaml:ro
      - ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/secrets/mas.secrets.yaml:/secrets.yaml:ro

  # ── controlplane: public agent-registration shim (POST /redpill only, routed by Caddy). Privilege
  # boundary: holds NO credentials of any kind — no env_file at all. It drives MAS's public
  # registration form and public/native-client OAuth device flow over telecrypt_net; it never
  # mints a Matrix password token or calls m.login.password. ────────────────────────────────────
  controlplane:
    image: ghcr.io/telecrypt-io/controlplane:0.4.0
    container_name: tc_controlplane
    restart: unless-stopped
    networks: [ telecrypt_net ]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    user: "991:991"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      - BACKEND_PUBLIC_URL=https://${BACKEND_HOST:?set BACKEND_HOST}
      - SERVER_NAME=${SERVER_NAME:?set SERVER_NAME}
    depends_on:
      mas:
        condition: service_started

  # ── janitor: the ONE component holding a standing MAS admin credential (lock stale
  # unclaimed accounts + owner sign-up digest). Same image, different entrypoint. No listening
  # port, no Caddy route, zero inbound surface. The source derives the cashier-admin exclusion
  # from SERVER_NAME; the one-shot job is invoked daily via systemd timer. ───────────────────────
  janitor:
    image: ghcr.io/telecrypt-io/controlplane:0.4.0
    container_name: tc_janitor
    restart: "no"
    networks: [ telecrypt_net ]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    user: "991:991"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    command: ["/janitor"]
    environment:
      - BILLING_ENV=${BILLING_ENV:?set BILLING_ENV}
      - SERVER_NAME=${SERVER_NAME:?set SERVER_NAME}
    # locker.secrets.env: MAS_ADMIN_CLIENT_ID/SECRET, JANITOR_DB_URL, OWNER_EMAIL, SMTP_*.
    # env_file is read by the rootless Compose operator, not by the container uid.
    env_file:
      - ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/secrets/locker.secrets.env
    depends_on:
      mas:
        condition: service_started

  # ── steward: public browser boundary. It authenticates via MAS and signs narrowly-scoped requests
  # to Cashier; it has no Dodo, Synapse-admin, or database credential. ─────────────────────────
  steward:
    image: ghcr.io/telecrypt-io/controlplane:0.4.0
    container_name: tc_steward
    restart: unless-stopped
    networks: [ telecrypt_net, cashier_plan_net ]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    user: "991:991"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    command: ["/steward"]
    environment:
      - BILLING_ENV=${BILLING_ENV:?set BILLING_ENV}
      - SERVER_NAME=${SERVER_NAME:?set SERVER_NAME}
      - BACKEND_PUBLIC_URL=https://${BACKEND_HOST:?set BACKEND_HOST}
    env_file:
      - ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/secrets/steward.secrets.env
    depends_on:
      mas:
        condition: service_started

  # ── cashier: private billing authority. Caddy routes only Dodo's signed webhook; Plan reaches
  # its command API on the isolated cashier_plan_net using Ed25519 assertions. ───────────────────
  cashier:
    image: ghcr.io/telecrypt-io/telecrypt-cashier:0.3.0
    container_name: tc_cashier
    restart: unless-stopped
    networks: [ telecrypt_net, cashier_plan_net ]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    user: "991:991"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      - BILLING_ENV=${BILLING_ENV:?set BILLING_ENV}
      - SERVER_NAME=${SERVER_NAME:?set SERVER_NAME}
      - BACKEND_PUBLIC_URL=https://${BACKEND_HOST:?set BACKEND_HOST}
      # Cashier uses Synapse's fixed internal admin endpoint and has no browser/OIDC routes.
    # cashier.secrets.env: CASHIER_DB_URL and Cashier/provider credentials.
    env_file:
      - ${TELECRYPT_DATA_DIR:?set TELECRYPT_DATA_DIR}/secrets/cashier.secrets.env

# Shared application network.
networks:
  telecrypt_net:
    name: telecrypt_net
  cashier_plan_net:
    internal: true
