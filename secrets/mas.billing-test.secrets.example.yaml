# Copy to mas.secrets.yaml inside the dedicated billing-test TELECRYPT_SECRETS_DIR.
secrets:
  encryption: "__CHANGEME_32_BYTE_HEX__"
  keys:
    - kid: "__CHANGEME__"
      key: |
        -----BEGIN PRIVATE KEY-----
        __CHANGEME__
        -----END PRIVATE KEY-----

database:
  host: __TEST_DB_HOST__
  port: 5432
  username: telecrypt_mas_test_user
  password: "__CHANGEME__"
  database: telecrypt_mas_test
  max_connections: 10
  min_connections: 0

matrix:
  kind: synapse
  homeserver: "test.telecrypt.io"
  endpoint: http://synapse:8008
  secret: "__CHANGEME_TEST_SHARED_SECRET__"

email:
  from: '"TeleCrypt.io TEST" <noreply-test@telecrypt.io>'
  transport:
    type: smtp
    hostname: "__CHANGEME_TEST_SMTP_HOST__"
    port: 587
    mode: starttls
    username: "__CHANGEME__"
    password: "__CHANGEME__"

clients:
  - client_id: "__CHANGEME_TEST_ULID_MAS_ADMIN__"
    client_auth_method: client_secret_basic
    client_secret: "__CHANGEME__"

  - client_id: "__CHANGEME_TEST_ULID_CASHIER__"
    client_auth_method: client_secret_basic
    client_secret: "__CHANGEME__"
    is_static: true
    redirect_uris:
      - "https://backend.test.telecrypt.io/plan/callback"

policy:
  data:
    admin_clients:
      - "__CHANGEME_TEST_ULID_MAS_ADMIN__"
