# MAS secrets — TEMPLATE.
# Deploy as mas.secrets.yaml in TELECRYPT_SECRETS_DIR with mode 600.
# Merged into MAS as the 2nd `--config` file. Generate the `secrets` block with:
#   docker run --rm ghcr.io/element-hq/matrix-authentication-service:1.16.0 config generate
# Fill every __CHANGEME__.

secrets:
  encryption: "__CHANGEME_32_BYTE_HEX__"
  keys:
    - kid: "__CHANGEME__"
      key: |
        -----BEGIN PRIVATE KEY-----
        __CHANGEME__
        -----END PRIVATE KEY-----

database:
  host: __DB_HOST__
  port: 5432
  username: telecrypt_mas_user
  password: "__CHANGEME__"                      # scram-sha-256; also set when creating the role on FreeBSD
  database: telecrypt_mas
  max_connections: 10
  min_connections: 0

matrix:
  kind: synapse
  homeserver: "telecrypt.io"
  endpoint: http://synapse:8008
  secret: "__CHANGEME_SHARED_SECRET__"          # MUST equal synapse.secrets.yaml -> matrix_authentication_service.secret
                                                # (this shared secret is NOT the same as SYNAPSE_ADMIN_TOKEN in cashier.secrets.env)

# SMTP for email verification on registration and password recovery.
email:
  from: '"TeleCrypt.io" <noreply@telecrypt.io>'
  transport:
    type: smtp
    hostname: "__CHANGEME_SMTP_HOST__"          # e.g. smtp.resend.com / smtp.sendgrid.net
    port: 587
    mode: starttls
    username: "__CHANGEME__"
    password: "__CHANGEME__"

# OAuth2 clients. client_id MUST be a ULID (generate: python3 -c "import ulid; print(ulid.new())")
# Keep this block WHOLE here (not split with config.yaml) — MAS replaces top-level arrays on merge.
clients:
  - client_id: "__CHANGEME_ULID_MAS_ADMIN__"    # janitor MAS admin client (client_credentials grant)
    client_auth_method: client_secret_basic
    client_secret: "__CHANGEME__"              # openssl rand -hex 32 → also set as MAS_ADMIN_CLIENT_SECRET

  - client_id: "__CHANGEME_ULID_CASHIER__"      # cashier OIDC client (authorization_code, Plan tab)
    client_auth_method: client_secret_basic
    client_secret: "__CHANGEME__"              # openssl rand -hex 32 → also set as MAS_OIDC_CLIENT_SECRET
    is_static: true
    redirect_uris:
      - "https://backend.telecrypt.io/plan/callback"

# MAS OPA policy: which clients may request urn:mas:admin scope.
# Keep whole here to co-locate with the client_id ULIDs above.
policy:
  data:
    admin_clients:
      - "__CHANGEME_ULID_MAS_ADMIN__"           # must match clients[0].client_id exactly
