# Copy to synapse.secrets.yaml inside the dedicated billing-test TELECRYPT_SECRETS_DIR.
database:
  name: psycopg2
  args:
    user: telecrypt_synapse_test_user
    database: telecrypt_synapse_test
    host: __TEST_DB_HOST__
    port: 5432
    password: "__CHANGEME__"
    cp_min: 2
    cp_max: 5

matrix_authentication_service:
  enabled: true
  endpoint: http://mas:8080
  secret: "__CHANGEME_TEST_SHARED_SECRET__"

media_storage_providers:
  - module: s3_storage_provider.S3StorageProviderBackend
    store_local: false
    store_remote: true
    store_synchronous: true
    config:
      bucket: "__CHANGEME_TEST_BUCKET__"
      region_name: "__CHANGEME_REGION__"
      endpoint_url: "https://sss.telecrypt.io/"
      prefix: "telecrypt_billing_test"
      access_key_id: "__CHANGEME_TEST_ONLY__"
      secret_access_key: "__CHANGEME_TEST_ONLY__"
      threadpool_size: 10
      request_checksum_calculation: "when_supported"
      response_checksum_validation: "when_supported"

macaroon_secret_key: "__CHANGEME__"
form_secret: "__CHANGEME__"
