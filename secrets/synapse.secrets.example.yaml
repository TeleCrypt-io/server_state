# Synapse secrets — TEMPLATE.
# Deploy as synapse.secrets.yaml in TELECRYPT_SECRETS_DIR with mode 600.
# Merged into Synapse as the 2nd `-c` file. Each top-level key here is a complete, secret-bearing
# block (kept whole so the merge is unambiguous). Fill every __CHANGEME__.

database:
  name: psycopg2
  args:
    user: telecrypt_synapse_user
    database: telecrypt_synapse
    host: __DB_HOST__
    port: 5432
    password: "__CHANGEME__"                 # scram-sha-256; also set when creating the role on FreeBSD
    cp_min: 5
    cp_max: 10

matrix_authentication_service:
  enabled: true
  endpoint: http://mas:8080
  secret: "__CHANGEME_SHARED_SECRET__"        # MUST equal mas.secrets.yaml -> matrix.secret  (openssl rand -hex 32)

# NOTE: Synapse admin access for cashier is granted via a dedicated MAS user whose token
# carries urn:synapse:admin:* scope (set by can_request_admin=true in MAS).
# That user's non-expiring compat token lives in cashier.secrets.env -> SYNAPSE_ADMIN_TOKEN.
# See secrets/README.md for provisioning steps.

# Media stored in EXTERNAL S3 (sss.telecrypt.io). Bucket/region/keys are pre-provisioned by you.
media_storage_providers:
  - module: s3_storage_provider.S3StorageProviderBackend
    store_local: false
    store_remote: true
    store_synchronous: true
    config:
      bucket: "__CHANGEME_BUCKET__"
      region_name: "__CHANGEME_REGION__"
      endpoint_url: "https://sss.telecrypt.io/"
      prefix: "telecrypt_io"
      access_key_id: "__CHANGEME__"
      secret_access_key: "__CHANGEME__"
      threadpool_size: 40
      request_checksum_calculation: "when_supported"
      response_checksum_validation: "when_supported"

macaroon_secret_key: "__CHANGEME__"            # openssl rand -hex 64
form_secret: "__CHANGEME__"                    # openssl rand -hex 64
