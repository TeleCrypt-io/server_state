# Synapse — committed base config. Contains NO secrets.
# The Harness writes public identity (server_name and public_baseurl) to a runtime layer after the
# private JSON overlay and before Compose validation. Secret-bearing values remain private; reviewed
# nonsecret loader options are committed here. The final identity layer owns public identity fields.

signing_key_path: "/signing.key"          # provided from TELECRYPT_DATA_DIR/secrets (never committed)
pid_file: /tmp/homeserver.pid
log_config: "/log.config"

# Keep Synapse's standard invite state and add only the state needed to classify storage
# invitations before joining. The fixed MSC3089 purpose key identifies a data-tree space;
# m.space.parent is needed to hide invitations for nested folders. The parent state key is the
# parent room ID, so it cannot be narrowed to one fixed key.
room_prejoin_state:
  additional_event_types:
    - [org.matrix.msc3088.purpose, org.matrix.msc3089.data_tree]
    - m.space.parent

# Plain HTTP; TLS terminated upstream → Caddy → here. x_forwarded trusts X-Forwarded-* headers.
listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    bind_addresses: ['0.0.0.0']
    resources:
      - names: [client]              # client resource includes client + media APIs; federation disabled
        compress: false

# server_name and public_baseurl: -> in the runtime identity layer. The complete database map
# (driver plus args) and complete matrix_authentication_service map (enabled, endpoint, and secret)
# are supplied by synapse.secrets.json. Synapse's config files are shallow-merged by top-level key;
# keeping partial maps here would silently discard required fields from the private map.

# media_storage_providers -> synapse.secrets.json. The S3-compatible endpoint is
# sss.telecrypt.io and is reachable only from authorized production and stage Linux VMs. Local
# uploads are stored
# synchronously with private bucket credentials; remote media is disabled.
# macaroon_secret_key and form_secret -> synapse.secrets.json

# Local media staging/cache dir. S3 is the durable media authority; this path is disposable and
# must not be treated as a durable media copy. The image entrypoint clears only this fixed mount.
media_store_path: /staging/media
enable_local_media_storage: false
max_upload_size: 128M
max_image_pixels: "32M"
dynamic_thumbnails: false
url_preview_enabled: false

# Federation fully disabled: empty whitelist = federate with nobody (blocks inbound and outbound).
# trusted_key_servers kept explicitly empty so Synapse does NOT fall back to the matrix.org default.
federation_domain_whitelist: []
trusted_key_servers: []

# Auth is fully delegated to MAS — no local registration or password login in Synapse.
enable_registration: false
password_config:
  enabled: false
  localdb_enabled: false

report_stats: false

# Custom user type for the inverted tier model (verified vs. everything else).
# Enforcement is done by the tier_controller module; Synapse just needs to accept this value.
user_types:
  extra_user_types:
    - verified

# Fail-closed capability restrictions for unverified users (uploads, room cap, encryption).
# Baked into the exact TeleCrypt Synapse image selected in compose.yml, which contains
# the Controlplane policy-module wheel. Its source and tests live in controlplane.
modules:
  - module: tier_controller.TierController
    config:
      restricted_room_cap: 3
      media_store_path: /staging/media

# Modern client features (Element X / sliding sync / Element Call delay events).
experimental_features:
  msc3266_enabled: true     # room summary (knocking over federation)
  msc4222_enabled: true     # state_after in sync v2
  msc4108_enabled: true     # QR login
  msc3575_enabled: true     # sliding sync
max_event_delay_duration: 24h

# vim:ft=yaml
