# Isolated billing-test Synapse base configuration. Contains no secrets.
server_name: "test.telecrypt.io"
public_baseurl: "https://backend.test.telecrypt.io/"
signing_key_path: "/signing.key"
pid_file: /data/homeserver.pid
log_config: "/log.config"

listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    bind_addresses: ['0.0.0.0']
    resources:
      - names: [client]
        compress: false

media_store_path: /data
max_upload_size: 150M
max_image_pixels: "32M"
dynamic_thumbnails: false

federation_domain_whitelist: []
trusted_key_servers: []

enable_registration: false
password_config:
  enabled: false
  localdb_enabled: false

report_stats: false

user_types:
  extra_user_types:
    - verified

modules:
  - module: tier_controller.TierController
    config:
      restricted_room_cap: 3

experimental_features:
  msc3266_enabled: true
  msc4222_enabled: true
  msc4108_enabled: true
  msc3575_enabled: true
max_event_delay_duration: 24h

# database, matrix_authentication_service, media_storage_providers, macaroon_secret_key, and
# form_secret must come from a test-only synapse.secrets.yaml in TELECRYPT_SECRETS_DIR.
